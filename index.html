  const valves: any[] = [], cams: any[] = [], driveSprockets: number[][] = [];
  const lobeCache: Record<string, any> = {};
  const lobeGeo = (Rb: number, lmax: number, dur: number) => {
    const key = `${Rb.toFixed(4)}|${lmax.toFixed(4)}|${dur}`;
    if (lobeCache[key]) return lobeCache[key];
    const shape = new THREE.Shape();
    for (let i = 0; i <= 180; i++) {
      const a = i / 180 * Math.PI * 2;
      let rel = a * 180 / Math.PI; if (rel > 180) rel -= 360;
      const lf = Math.abs(rel) < dur / 4 ? lmax * Math.pow(Math.cos(Math.PI * rel / (dur / 2)), 2) : 0;
      const rd = Rb + lf;
      if (i === 0) shape.moveTo(rd * Math.cos(a), rd * Math.sin(a)); else shape.lineTo(rd * Math.cos(a), rd * Math.sin(a));
    }
    const geo = keep(new THREE.ExtrudeGeometry(shape, { depth: 0.14 * B, bevelEnabled: false, curveSegments: 4 }));
    geo.translate(0, 0, -0.07 * B);
    lobeCache[key] = geo;
    return geo;
  };
  /* --- distribution à arbre à cames central (OHV) : poussoirs, tiges et culbuteurs, 2 soupapes par cylindre --- */
  let ohvCam: any = null;
  const OHV_ARM = 0.28 * B, OHV_RATIO = 1.65;
  const buildOhvHead = (h: HeadGeo, members: CylGeo[], hg: any) => {
    const deck = yHead, sC = lay.heads.length > 1 ? (h.psi < 0 ? 1 : -1) : 1;
    const RbO = 0.17 * B;
    const camW = lay.heads.length > 1 ? [0, Rcw + 0.5 * B] : toWorld(h.psi, 0.85 * B, Rcw + 0.6 * B);
    if (!ohvCam) {
      const g = new THREE.Group(); g.position.set(camW[0], camW[1], 0); root.add(g);
      const z0 = zMinC - 0.6 * B;
      const shaft = zCyl(0.09 * B, zFront - z0, M.steel, 16); shaft.position.z = (zFront + z0) / 2; g.add(shaft);
      const spR = 0.42 * B;
      const spr = zCyl(spR, 0.05 * B, M.dark, 40); spr.position.z = zFront; g.add(spr);
      const notch = mesh(new THREE.BoxGeometry(0.07 * B, 0.12 * B, 0.06 * B), M.vin); notch.position.set(spR - 0.07 * B, 0, zFront + 0.03 * B); g.add(notch);
      driveSprockets.push([camW[0], camW[1], spR]);
      ohvCam = { g, base: 0 };
      cams.push(ohvCam);
      anchors.camIn = anchor(root, camW[0] + 0.25 * B, camW[1] + 0.2 * B, zMinC - 0.5 * B);
    }
    const zMin = Math.min(...members.map(c => c.z)), zMax = Math.max(...members.map(c => c.z));
    members.forEach(c => {
      const U = units.find(x => x.c.idx === c.idx)!;
      (['in', 'ex'] as const).forEach(kind => {
        const dv = (kind === 'in' ? 0.48 : 0.4) * B, lmax = VALVE_RATIO.lift * dv;
        const z = c.z + (kind === 'in' ? -1 : 1) * 0.24 * B;
        const seat = new THREE.Vector3(0, deck - 0.005 * B, z), uv = new THREE.Vector3(0, 1, 0);
        const mat = kind === 'in' ? M.vin : M.vex;
        const vg = new THREE.Group(); hg.add(vg);
        const hd = mesh(new THREE.CylinderGeometry(dv / 2, dv / 2 * 0.95, 0.04 * B, 24), mat); hd.position.y = 0.02 * B; vg.add(hd);
        const tu = mesh(new THREE.CylinderGeometry(0.035 * B, dv / 2 * 0.95, 0.18 * B, 24), mat); tu.position.y = 0.13 * B; vg.add(tu);
        const st = mesh(new THREE.CylinderGeometry(0.03 * B, 0.03 * B, Ls, 10), M.steel); st.position.y = Ls / 2; vg.add(st);
        const rt = mesh(new THREE.CylinderGeometry(0.12 * B, 0.08 * B, 0.04 * B, 18), M.forged); rt.position.y = Ls - 0.2 * B; vg.add(rt);
        const spG = new THREE.Group(); spG.position.copy(seat).addScaledVector(uv, 0.5 * B); hg.add(spG);
        const sp = new THREE.Mesh(helixGeo, M.spring); spG.add(sp);
        const ps = kind === 'in' ? sC : -sC;
        const pc = new THREE.CatmullRomCurve3([seat.clone().add(new THREE.Vector3(0, 0.05 * B, 0)), new THREE.Vector3(ps * 0.45 * B, deck + 0.3 * B, z), new THREE.Vector3(ps * 1.05 * B, deck + 0.42 * B, z)]);
        hg.add(mesh(new THREE.TubeGeometry(pc, 20, dv / 2 * 0.85, 12, false), U.ports[kind]));
        const piv = new THREE.Group(); piv.position.set(sC * OHV_ARM, deck + Ls + 0.05 * B, z); hg.add(piv);
        const len = OHV_ARM + 0.25 * B;
        const rk = mesh(new THREE.BoxGeometry(len, 0.06 * B, 0.09 * B), M.forged); rk.position.x = sC * (0.17 * B - OHV_ARM) / 2; piv.add(rk);
        piv.add(zCyl(0.04 * B, 0.13 * B, M.steel, 10));
        const topW = toWorld(h.psi, sC * (OHV_ARM + 0.17 * B), deck + Ls + 0.02 * B);
        const dx = topW[0] - camW[0], dy = topW[1] - camW[1], dl = Math.hypot(dx, dy);
        const dir = new THREE.Vector3(dx / dl, dy / dl, 0);
        const bot = [camW[0] + dir.x * (RbO + 0.02 * B), camW[1] + dir.y * (RbO + 0.02 * B)];
        const plen = Math.hypot(topW[0] - bot[0], topW[1] - bot[1]);
        const pg = new THREE.Group(); pg.position.set(bot[0], bot[1], z); pg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); root.add(pg);
        const prod = mesh(new THREE.CylinderGeometry(0.025 * B, 0.025 * B, plen, 8), M.steel); prod.position.y = plen / 2; pg.add(prod);
        const lif = mesh(new THREE.CylinderGeometry(0.085 * B, 0.085 * B, 0.32 * B, 14), M.forged); lif.position.y = 0.16 * B; pg.add(lif);
        const open = kind === 'in' ? TIMING.ivo : TIMING.evo, dur = kind === 'in' ? TIMING.inDur : TIMING.exDur;
        const lobe = new THREE.Mesh(lobeGeo(RbO, lmax / OHV_RATIO, dur), M.forged);
        lobe.position.z = z; lobe.rotation.z = Math.atan2(dir.y, dir.x) + rad((c.phase + open + dur / 2) / 2);
        ohvCam.g.add(lobe);
        valves.push({ g: vg, sp, seat, u: uv, lmax, kind, phase: c.phase, U, rocker: piv, rs: sC, push: pg, pbase: [bot[0], bot[1], z], pdir: dir });
        if (c.idx === 0) {
          const k = kind === 'in' ? 'vin' : 'vex';
          if (!anchors[k]) anchors[k] = anchor(hg, ps * 1.05 * B, deck + 0.44 * B, z);
          if (!anchors.pushrod) anchors.pushrod = anchor(root, (bot[0] + topW[0]) / 2, (bot[1] + topW[1]) / 2, z);
          if (!anchors.rocker) anchors.rocker = anchor(hg, sC * OHV_ARM, deck + Ls + 0.12 * B, z);
        }
      });
    });
    const headTop = deck + Ls + 0.42 * B;
    ghostBox(hg, -0.8 * B, 0.8 * B, linerBot, deck, zMin - 0.62 * B, zMax + 0.62 * B);
    ghostBox(hg, -1.05 * B, 1.05 * B, deck, deck + 0.7 * B, zMin - 0.62 * B, zMax + 0.62 * B);
    ghostBox(hg, -1.05 * B, 1.05 * B, deck + 0.7 * B, headTop, zMin - 0.62 * B, zMax + 0.62 * B, false);
    [[-1.05 * B, headTop], [1.05 * B, headTop], [-1.05 * B, linerBot], [1.05 * B, linerBot]].forEach(([x, y]) => {
      bounds.push([...toWorld(h.psi, x, y), zMin - 0.62 * B], [...toWorld(h.psi, x, y), zMax + 0.62 * B]);
    });
  };

  let firstHeadDone = false;
  lay.heads.forEach((h, hi) => {
    const members = lay.cyls.filter(c => c.head === hi);
    if (!members.length) return;
    const hg = new THREE.Group(); hg.rotation.z = -rad(h.psi); root.add(hg);
    if (inp.ohv && !h.vr) { buildOhvHead(h, members, hg); return; }
    const zMin = Math.min(...members.map(c => c.z)), zMax = Math.max(...members.map(c => c.z));
    const Rb = (h.vr ? 0.1 : 0.16) * B;
    type VSpec = { c: CylGeo; kind: 'in' | 'ex'; sgn: number; d: number; lmax: number; uv: any; rotZ: number; seat: any; col: string; camX: number; camY: number };
    const vl: VSpec[] = [];
    let deck = yHead;
    members.forEach(c => {
      const d = rad(c.psi - h.psi), xc = yHead * Math.sin(d);
      deck = yHead * Math.cos(d);
      (['in', 'ex'] as const).forEach(kind => {
        const sgn = kind === 'in' ? h.inSgn : -h.inSgn;
        const dv = (h.vr ? (kind === 'in' ? VR_VALVE.dIn : VR_VALVE.dEx) : (kind === 'in' ? VALVE_RATIO.dIn : VALVE_RATIO.dEx)) * B;
        const lmax = VALVE_RATIO.lift * dv;
        const uv = h.vr ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(sgn * Math.sin(tilt), Math.cos(tilt), 0);
        const xs = xc + sgn * (h.vr ? 0.22 : 0.2) * B;
        let camX: number, camY: number, col: string;
        if (h.vr) { camX = xs; camY = deck + Ls + tapH + Rb; col = 'x' + Math.round(xs / B * 40); }
        else { const off = Ls + tapH + Rb; camX = sgn * xV + uv.x * off; camY = yHead + uv.y * off; col = kind; }
        [-zV, zV].forEach(dz => vl.push({ c, kind, sgn, d: dv, lmax, uv, rotZ: h.vr ? 0 : -sgn * tilt, seat: new THREE.Vector3(xs, deck - 0.005 * B, c.z + dz), col, camX, camY }));
      });
    });
    /* culasse VR : les files de soupapes trop proches partagent un arbre (comme les deux arbres du VR6) */
    if (h.vr) {
      const xsU = Array.from(new Set(vl.map(v => +v.seat.x.toFixed(5)))).sort((p, q) => p - q);
      const clusters: number[][] = [];
      xsU.forEach(x => { const cl = clusters[clusters.length - 1]; if (cl && x - cl[cl.length - 1] < 0.3 * B) cl.push(x); else clusters.push([x]); });
      vl.forEach(v => {
        const ci = clusters.findIndex(cl => cl.some(x => Math.abs(x - v.seat.x) < 1e-4));
        const cl = clusters[ci];
        v.col = 'k' + ci; v.camX = cl.reduce((a2, x) => a2 + x, 0) / cl.length;
      });
    }
    /* arbres à cames : un par file de soupapes */
    const cols: Record<string, VSpec[]> = {};
    vl.forEach(v => { (cols[v.col] = cols[v.col] || []).push(v); });
    const colKeys = Object.keys(cols).sort((a, b) => cols[a][0].camX - cols[b][0].camX);
    let headTop = deck + 0.62 * B;
    colKeys.forEach((key, ci) => {
      const list = cols[key], v0 = list[0];
      const camG = new THREE.Group(); camG.position.set(v0.camX, v0.camY, 0); hg.add(camG);
      const z0 = zMin - 0.6 * B;
      const shaft = zCyl(0.07 * B, zFront - z0, M.steel, 14); shaft.position.z = (zFront + z0) / 2; camG.add(shaft);
      list.forEach(v => {
        const open = v.kind === 'in' ? TIMING.ivo : TIMING.evo, dur = v.kind === 'in' ? TIMING.inDur : TIMING.exDur;
        const lobe = new THREE.Mesh(lobeGeo(Rb, v.lmax, dur), M.forged);
        lobe.position.z = v.seat.z;
        lobe.rotation.z = rad((v.c.phase + open + dur / 2) / 2);
        camG.add(lobe);
      });
      const drive = !h.vr || ci === 0 || ci === colKeys.length - 1;
      if (drive) {
        const spR = 0.42 * B;
        const spr = zCyl(spR, 0.05 * B, M.dark, 40); spr.position.z = zFront; camG.add(spr);
        const notch = mesh(new THREE.BoxGeometry(0.07 * B, 0.12 * B, 0.06 * B), v0.kind === 'in' ? M.vin : M.vex);
        notch.position.set(spR - 0.07 * B, 0, zFront + 0.03 * B); camG.add(notch);
        driveSprockets.push([...toWorld(h.psi, v0.camX, v0.camY), spR]);
      }
      cams.push({ g: camG, base: Math.atan2(-v0.uv.y, -v0.uv.x) });
      headTop = Math.max(headTop, v0.camY + Rb + v0.lmax + 0.12 * B);
      if (!firstHeadDone && members.some(c => c.idx === 0)) {
        const tagK = v0.kind === 'in' ? 'camIn' : 'camEx';
        if (!anchors[tagK]) anchors[tagK] = anchor(hg, v0.camX, v0.camY + 0.3 * B, zMin - 0.55 * B);
      }
    });
    /* soupapes, ressorts, conduits */
    vl.forEach(v => {
      const U = units.find(x => x.c.idx === v.c.idx)!;
      const vg = new THREE.Group(); vg.rotation.z = v.rotZ; hg.add(vg);
      const mat = v.kind === 'in' ? M.vin : M.vex;
      const head = mesh(new THREE.CylinderGeometry(v.d / 2, v.d / 2 * 0.95, 0.04 * B, 24), mat); head.position.y = 0.02 * B; vg.add(head);
      const tulip = mesh(new THREE.CylinderGeometry(0.03 * B, v.d / 2 * 0.95, 0.16 * B, 24), mat); tulip.position.y = 0.12 * B; vg.add(tulip);
      const stem = mesh(new THREE.CylinderGeometry(0.028 * B, 0.028 * B, Ls, 10), M.steel); stem.position.y = Ls / 2; vg.add(stem);
      const ret = mesh(new THREE.CylinderGeometry(0.11 * B, 0.075 * B, 0.04 * B, 18), M.forged); ret.position.y = Ls - 0.2 * B; vg.add(ret);
      const tap = mesh(new THREE.CylinderGeometry((h.vr ? 0.1 : 0.13) * B, (h.vr ? 0.1 : 0.13) * B, tapH, 22), M.forged); tap.position.y = Ls + tapH / 2; vg.add(tap);
      const spG = new THREE.Group(); spG.rotation.z = v.rotZ; spG.position.copy(v.seat).addScaledVector(v.uv, 0.5 * B); hg.add(spG);
      const sp = new THREE.Mesh(helixGeo, M.spring); spG.add(sp);
      if (!h.vr) {
        const pc = new THREE.CatmullRomCurve3([
          v.seat.clone().add(new THREE.Vector3(0, 0.05 * B, 0)),
          new THREE.Vector3(v.sgn * 0.44 * B, yHead + 0.28 * B, v.seat.z),
          new THREE.Vector3(v.sgn * 1.0 * B, yHead + 0.4 * B, v.seat.z),
        ]);
        hg.add(mesh(new THREE.TubeGeometry(pc, 20, v.d / 2 * 0.85, 12, false), U.ports[v.kind]));
      }
      valves.push({ g: vg, sp, seat: v.seat, u: v.uv, lmax: v.lmax, kind: v.kind, phase: v.c.phase, U });
      if (v.c.idx === 0 && !anchors[v.kind === 'in' ? 'vin' : 'vex']) {
        anchors[v.kind === 'in' ? 'vin' : 'vex'] = h.vr
          ? anchor(hg, v.seat.x, deck + Ls * 0.55, v.seat.z)
          : anchor(hg, v.sgn * 1.0 * B, yHead + 0.42 * B, v.seat.z);
      }
    });
    if (members.some(c => c.idx === 0)) firstHeadDone = true;
    /* carters fantômes : bloc et culasse de ce banc */
    const xs = vl.map(v => v.seat.x), hx0 = Math.min(-B, Math.min(...xs) - 0.45 * B), hx1 = Math.max(B, Math.max(...xs) + 0.45 * B);
    const bx = h.vr ? Math.max(...members.map(c => Math.abs(yHead * Math.sin(rad(c.psi - h.psi))))) + 0.75 * B : 0.8 * B;
    ghostBox(hg, -bx, bx, linerBot * Math.cos(rad(h.vr ? 7.5 : 0)), deck, zMin - 0.62 * B, zMax + 0.62 * B);
    ghostBox(hg, hx0, hx1, deck, deck + 0.62 * B, zMin - 0.62 * B, zMax + 0.62 * B);
    ghostBox(hg, hx0, hx1, deck + 0.62 * B, headTop, zMin - 0.62 * B, zMax + 0.62 * B, false);
    [[hx0, headTop], [hx1, headTop], [hx0, linerBot], [hx1, linerBot]].forEach(([x, y]) => {
      bounds.push([...toWorld(h.psi, x, y), zMin - 0.62 * B], [...toWorld(h.psi, x, y), zMax + 0.62 * B]);
    });
  });

  /* --- vilebrequin multi-manetons --- */
  const crank = new THREE.Group(); root.add(crank);
  const rb = 0.36 * B, a0 = Math.PI + 0.42, a1 = 2 * Math.PI - 0.42;
  const ws = new THREE.Shape();
  ws.moveTo(rb, r); ws.absarc(0, r, rb, 0, Math.PI, false);
  ws.lineTo(Rcw * Math.cos(a0), Rcw * Math.sin(a0)); ws.absarc(0, 0, Rcw, a0, a1, false); ws.lineTo(rb, r);
  const webGeo = keep(new THREE.ExtrudeGeometry(ws, { depth: wWeb, bevelEnabled: false, curveSegments: 20 }));
  const groups = throwGroups(lay.cyls, B);
  const spans: number[][] = [];
  groups.forEach(g => {
    g.forEach(c => {
      const b = rad(crankPinAngle(c));
      const pin = zCyl(pinR, wRod + 0.02 * B, M.steel, 24); pin.position.set(r * Math.sin(b), r * Math.cos(b), c.z); crank.add(pin);
    });
    const zF = g[0].z + wRod / 2, zR = g[g.length - 1].z - wRod / 2;
    const wf = new THREE.Mesh(webGeo, M.forged); wf.rotation.z = -rad(crankPinAngle(g[0])); wf.position.z = zF; crank.add(wf);
    const wr = new THREE.Mesh(webGeo, M.forged); wr.rotation.z = -rad(crankPinAngle(g[g.length - 1])); wr.position.z = zR - wWeb; crank.add(wr);
    for (let i = 0; i + 1 < g.length; i++) {
      const b1 = rad(crankPinAngle(g[i])), b2 = rad(crankPinAngle(g[i + 1]));
      if (Math.abs(Math.sin((b1 - b2) / 2)) < 0.02) continue;
      const pts: number[][] = [];
      [b1, b2].forEach(b => { for (let k = 0; k < 36; k++) { const a = k / 36 * Math.PI * 2; pts.push([r * Math.sin(b) + (pinR + 0.05 * B) * Math.cos(a), r * Math.cos(b) + (pinR + 0.05 * B) * Math.sin(a)]); } });
      const hl = convexHull(pts), sh = new THREE.Shape();
      hl.forEach((p, k) => { if (k === 0) sh.moveTo(p[0], p[1]); else sh.lineTo(p[0], p[1]); });
      const fg = keep(new THREE.ExtrudeGeometry(sh, { depth: 0.05 * B, bevelEnabled: false }));
      const fw = new THREE.Mesh(fg, M.forged); fw.position.z = (g[i].z + g[i + 1].z) / 2 - 0.025 * B; crank.add(fw);
    }
    spans.push([zR - wWeb, zF + wWeb]);
  });
  const journal = (z0: number, z1: number) => { if (z1 - z0 < 0.005 * B) return; const j = zCyl(journalR, z1 - z0, M.steel, 28); j.position.z = (z0 + z1) / 2; crank.add(j); };
  journal(spans[0][1], zFront);
  for (let i = 0; i + 1 < spans.length; i++) journal(spans[i + 1][1], spans[i][0]);
  journal(zRear, spans[spans.length - 1][0]);
  const fwR = Math.max(1.0 * B, Rcw + 0.2 * B);
  const fw = zCyl(fwR, 0.08 * B, M.dark, 56); fw.position.z = zRear - 0.04 * B; crank.add(fw);
  const fwMark = mesh(new THREE.BoxGeometry(0.08 * B, 0.2 * B, 0.1 * B), M.vex); fwMark.position.set(0, fwR - 0.12 * B, zRear - 0.04 * B); crank.add(fwMark);
  const cspR = 0.21 * B;
  const csp = zCyl(cspR, 0.05 * B, M.dark, 28); csp.position.z = zFront; crank.add(csp);
  const cnotch = mesh(new THREE.BoxGeometry(0.05 * B, 0.08 * B, 0.06 * B), M.vex); cnotch.position.set(0, cspR - 0.05 * B, zFront + 0.03 * B); crank.add(cnotch);
  anchors.crank = anchor(root, 0, -Rcw - 0.05 * B, (spans[0][0] + spans[0][1]) / 2);

  /* --- carter-moteur fantôme --- */
  const caseTop = Math.max(Rcw + 0.15 * B, Math.min(...lay.heads.map(h => linerBot * Math.cos(rad(h.psi)))));
  const caseHalf = Math.max(1.05 * B, Rcw + 0.3 * B, ...lay.heads.map(h => Math.abs(linerBot * Math.sin(rad(h.psi))) + 0.3 * B));
  ghostBox(root, -caseHalf, caseHalf, -Rcw - 0.2 * B, caseTop, zMinC - 0.7 * B, zMaxC + 0.7 * B, false);
  bounds.push([-caseHalf, -fwR, zRear - 0.1 * B], [caseHalf, -fwR, zFront + 0.1 * B]);

  /* --- courroie / chaîne de distribution : enveloppe convexe des pignons --- */
  const bp: number[][] = [];
  const addC = (cx: number, cy: number, R: number) => { for (let i = 0; i < 64; i++) { const a = i / 64 * 2 * Math.PI; bp.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); } };
  addC(0, 0, cspR + 0.025 * B); driveSprockets.forEach(s => addC(s[0], s[1], s[2] + 0.025 * B));
  const hull = convexHull(bp), beltPts: any[] = [];
  hull.forEach((p, i) => {
    const q = hull[(i + 1) % hull.length], d = Math.hypot(q[0] - p[0], q[1] - p[1]), k = Math.max(1, Math.ceil(d / (0.05 * B)));
    for (let j = 0; j < k; j++) beltPts.push(new THREE.Vector3(p[0] + (q[0] - p[0]) * j / k, p[1] + (q[1] - p[1]) * j / k, zFront));
  });
  root.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(beltPts, true, 'centripetal'), Math.min(1600, beltPts.length * 2), 0.028 * B, 6, true), M.belt));
  const ds = driveSprockets[0];
  anchors.belt = anchor(root, ds[0] * 0.5, ds[1] * 0.5, zFront);

  /* --- éclairage dynamique : étincelle et flamme du cylindre actif --- */
  const sparkLight = new THREE.PointLight(0xfff0c0, 0, 3 * B, 2); root.add(sparkLight);
  const flame = new THREE.PointLight(0xffa040, 0, 6 * B, 2); root.add(flame);

  /* --- encombrement pour cadrer la caméra --- */
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  bounds.forEach(p => p.forEach((v, i) => { lo[i] = Math.min(lo[i], v); hi[i] = Math.max(hi[i], v); }));
  const center = lo.map((v, i) => (v + hi[i]) / 2);
  const radius = 0.5 * Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]);

  const update = (thDeg: number, R: EngineResult, I: EngineInputs) => {
    crank.rotation.z = -rad(thDeg);
    const k = makeKin(I, R);
    let best: any = null, bestGlow = 0, sparkU: any = null, sparkOn = 0;
    units.forEach(U => {
      const th = ((thDeg - U.c.phase) % 720 + 720) % 720, t = rad(th), sn = Math.sin(t), cs = Math.cos(t);
      const xPin = r * cs + Math.sqrt(L * L - r * r * sn * sn);
      U.piston.position.y = xPin;
      U.rod.position.set(r * sn, r * cs, 0);
      U.rod.rotation.z = Math.atan2(r * sn, xPin - r * cs);
      const crownY = xPin + cH, hgt = Math.max(0.001, yHead - crownY);
      U.gas.scale.y = hgt; U.gas.position.y = crownY + hgt / 2;
      const fin = liftFrac(th, TIMING.ivo, TIMING.inDur), fex = liftFrac(th, TIMING.evo, TIMING.exDur);
      U.ports.in.opacity = 0.14 + 0.42 * fin; U.ports.ex.opacity = 0.14 + 0.42 * fex;
      const c = cycleAt(R, k, th);
      let rgb: number[], op = 0.4, glow = 0;
      if (c.gas === 'frais') { rgb = [0.36, 0.56, 0.92]; op = 0.22 + 0.15 * fin; }
      else if (c.gas === 'echappement') { rgb = [0.55, 0.47, 0.41]; op = 0.34; }
      else { rgb = gasRGB(c.T); glow = c.gas === 'brule' ? Math.min(1, Math.max(0, (c.T - 900) / 1800)) : 0; op = 0.36 + 0.32 * glow; }
      U.gm.color.setRGB(rgb[0], rgb[1], rgb[2]);
      U.gm.emissive.setRGB(rgb[0] * glow, rgb[1] * glow * 0.8, rgb[2] * glow * 0.5);
      U.gm.opacity = op;
      if (glow > bestGlow) { bestGlow = glow; best = U; }
      if (U.spark) {
        const d = th - 352, on = d >= 0 && d < 10 ? 1 - d / 10 : 0;
        U.sm.opacity = on; U.spark.scale.setScalar(0.5 + on);
        if (on > sparkOn) { sparkOn = on; sparkU = U; }
      }
      if (U.sprays.length) {
        const d = th - 354, on = d >= 0 && d < 26, p = on ? d / 26 : 0;
        U.pm.opacity = on ? 0.6 * (1 - 0.6 * p) : 0;
        U.sprays.forEach((s: any) => s.scale.set(1, 0.25 + 0.95 * p, 1));
      }
    });
    if (best) { flame.position.set(best.flamePos[0], best.flamePos[1], best.flamePos[2]); }
    flame.intensity = bestGlow * 2.4;
    if (sparkU) sparkLight.position.set(sparkU.flamePos[0], sparkU.flamePos[1], sparkU.flamePos[2]);
    sparkLight.intensity = sparkOn * 3;
    cams.forEach(c => { c.g.rotation.z = c.base - rad(thDeg) / 2; });
    valves.forEach(v => {
      const th = thDeg - v.phase;
      const f = v.kind === 'in' ? liftFrac(th, TIMING.ivo, TIMING.inDur) : liftFrac(th, TIMING.evo, TIMING.exDur);
      const lf = f * v.lmax;
      v.g.position.copy(v.seat).addScaledVector(v.u, -lf);
      v.sp.scale.y = 0.33 * B - lf;
      if (v.rocker) {
        v.rocker.rotation.z = v.rs * lf / OHV_ARM;
        const pl = lf / OHV_RATIO;
        v.push.position.set(v.pbase[0] + v.pdir.x * pl, v.pbase[1] + v.pdir.y * pl, v.pbase[2]);
      }
    });
  };
  const setGhost = (on: boolean) => {
    M.glass.opacity = on ? 0.08 : 0.4; M.glass.needsUpdate = true;
    M.alu.transparent = on; M.alu.opacity = on ? 0.5 : 1; M.alu.depthWrite = !on; M.alu.needsUpdate = true;
  };
  const dispose = () => trash.forEach(o => o && o.dispose && o.dispose());
  const phases = lay.cyls.slice().sort((a, b) => a.idx - b.idx).map(c => c.phase);
  return { root, update, setGhost, anchors, center, radius, lo, hi, phases, n, dispose, crankPins: lay.cyls.map(c => ({ cyl: c.idx + 1, angle: crankPinAngle(c), z: c.z })) };
}

const IcPlay = () => <Ico><polygon points="6 3 20 12 6 21 6 3" /></Ico>;
const IcPause = () => <Ico><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></Ico>;
const IcPlus = () => <Ico><path d="M12 5v14M5 12h14" /></Ico>;
const IcMinus = () => <Ico><path d="M5 12h14" /></Ico>;
const strokeOf = (local: number) => Math.min(3, Math.floor((((local % 720) + 720) % 720) / 180));

function StrokeBand({ onSeek, cyl }: { onSeek: () => void; cyl: number }) {
  const boxRef = useRef<any>(null), curRef = useRef<any>(null), cellsRef = useRef<any>(null);
  useEffect(() => {
    const f = (a: number) => {
      if (curRef.current) curRef.current.style.left = `${(a / 7.2).toFixed(3)}%`;
      const cells = cellsRef.current ? cellsRef.current.children : null;
      if (cells) { const s = strokeOf(a); for (let i = 0; i < cells.length; i++) cells[i].setAttribute('data-on', i === s ? '1' : '0'); }
    };
    f(crankBus.local());
    return crankBus.sub(f);
  }, []);
  const seek = (e: any) => {
    const rc = boxRef.current.getBoundingClientRect();
    onSeek();
    crankBus.set(Math.max(0, Math.min(719, (e.clientX - rc.left) / rc.width * 720)) + crankBus.phase);
  };
  const bar = (a: number, b: number, cls: string, label?: string) =>
    <div className={`vbar ${cls}`} style={{ left: `${a / 7.2}%`, width: `${(b - a) / 7.2}%` }}>{label}</div>;
  return (
    <div className="flex flex-col gap-1.5">
      <div className="text-[12px] text-muted">Diagramme de distribution du cylindre {cyl}</div>
      <div ref={boxRef} className="band" onClick={seek} title="Cliquer pour placer ce cylindre à cet angle">
        <div ref={cellsRef} className="band-strokes">
          {STROKES.map((s, i) => <div key={s} className="band-cell" data-on="0"><span>{i + 1}</span>{s}</div>)}
        </div>
        <div className="band-row">{bar(0, 220, 'vin', 'Soupapes d\'admission ouvertes')}{bar(710, 720, 'vin')}</div>
        <div className="band-row">{bar(500, 720, 'vex', 'Échappement ouvert')}{bar(0, 10, 'vex')}</div>
        <div ref={curRef} className="band-cursor" />
      </div>
      <div className="band-ticks mono" aria-hidden="true">
        {[0, 180, 360, 540, 720].map((d, i) => (
          <span key={d} style={{ left: `${d / 7.2}%`, transform: i === 0 ? 'none' : i === 4 ? 'translateX(-100%)' : 'translateX(-50%)' }}>{d}° {i % 2 ? 'PMB' : 'PMH'}</span>
        ))}
      </div>
      <p className="text-[11.5px] text-muted">Calage indicatif : AOA {TIMING.aoa}° · RFA {TIMING.rfa}° · AOE {TIMING.aoe}° · RFE {TIMING.rfe}° (croisement {TIMING.aoa + TIMING.rfe}°). Le cycle théorique, lui, suppose des ouvertures et fermetures aux points morts.</p>
    </div>
  );
}

function FiringStrip({ firing, phases, focus, onFocus }: { firing: number[]; phases: number[]; focus: number; onFocus: (c: number) => void }) {
  const boxRef = useRef<any>(null);
  const n = firing.length;
  useEffect(() => {
    const f = () => {
      const box = boxRef.current; if (!box) return;
      const kids = box.querySelectorAll('[data-cyl]');
      for (let i = 0; i < kids.length; i++) {
        const c = Number(kids[i].getAttribute('data-cyl'));
        const loc = ((crankBus.angle - phases[c - 1]) % 720 + 720) % 720;
        kids[i].setAttribute('data-s', String(strokeOf(loc)));
        kids[i].setAttribute('data-fire', loc >= 360 && loc < 360 + 720 / n ? '1' : '0');
      }
    };
    f();
    return crankBus.sub(f);
  }, [firing.join('-')]);
  return (
    <div className="flex flex-col gap-1.5">
      <div className="text-[11.5px] text-muted">Ordre d'allumage · cliquez un cylindre pour le suivre</div>
      <div ref={boxRef} className="fstrip">
        {firing.map((c, i) => (
          <button key={c} type="button" data-cyl={c} data-s="0" data-fire="0" aria-pressed={focus === c - 1} onClick={() => onFocus(c - 1)}
            title={`Cylindre ${c} · décalage ${fmtTick(phases[c - 1])}°V`}>{c}</button>
        ))}
      </div>
      <div className="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-muted">
        {STROKES.map((s, i) => <span key={s} className="inline-flex items-center gap-1"><i className="sdot" data-s={i} />{s}</span>)}
      </div>
    </div>
  );
}

function Engine3D({ res, inp, car }: { res: EngineResult; inp: EngineInputs; car: CarInfo }) {
  const hostRef = useRef<any>(null), labelBoxRef = useRef<any>(null), sliderRef = useRef<any>(null), zoomRef = useRef<any>(null), stageTxtRef = useRef<any>(null);
  const ro: Record<string, any> = { th: useRef(null), stroke: useRef(null), pos: useRef(null), vp: useRef(null), V: useRef(null), P: useRef(null), T: useRef(null), li: useRef(null), le: useRef(null) };
  const reduce = typeof window !== 'undefined' && !!window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const [playing, setPlaying] = useState(!reduce);
  const [speed, setSpeed] = useState<'lent' | 'normal' | 'rapide'>('normal');
  const [ghost, setGhost] = useState(true);
  const [showLabels, setShowLabels] = useState(true);
  const [focus, setFocus] = useState(0);
  const [err, setErr] = useState<string | null>(null);
  const phases = useMemo(() => cylinderPhases(inp.firing), [inp.firing.join('-')]);
  const fc = Math.min(focus, inp.nCyl - 1);
  const live = useRef<any>({});
  live.current = { res, inp, playing, speedDeg: speed === 'lent' ? 40 : speed === 'normal' ? 120 : 360, showLabels, focus: fc, phases };
  const st = useRef<any>({ dirty: true });

  useEffect(() => { crankBus.setPhase(phases[fc] || 0); st.current.dirty = true; }, [fc, phases]);

  const computeDists = (s: any) => {
    const asp = Math.max(0.45, Math.min(1, s.camera.aspect / 1.1)), k = 1 / Math.tan(16 * Math.PI / 180);
    s.dEng = s.engR * k * 0.9 / asp; s.dCar = Math.max(s.dEng * 2.5, s.carR * k * 0.95 / asp);
    s.minDist = s.dEng * 0.35; s.maxDist = s.dCar * 1.5;
  };
  const distForT = (s: any, t: number) => s.dEng * Math.pow(s.dCar / s.dEng, t);

  /* scène, caméra, orbite, boucle d'animation */
  useEffect(() => {
    if (typeof THREE === 'undefined') { setErr("Three.js n'a pas pu être chargé : la vue 3D est indisponible. Les diagrammes restent utilisables."); return; }
    const host = hostRef.current;
    let renderer: any;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
    catch (e) { setErr("WebGL est indisponible sur cet appareil : la vue 3D ne peut pas s'afficher."); return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    const el = renderer.domElement;
    Object.assign(el.style, { width: '100%', height: '100%', display: 'block', cursor: 'grab', touchAction: 'pan-y' });
    host.appendChild(el);
    const scene = new THREE.Scene();
    try { scene.environment = buildStudioEnv(renderer); } catch (e) { /* reflets facultatifs */ }
    const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 900);
    scene.add(new THREE.HemisphereLight(0xe4ecf4, 0x2a3036, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(40, 70, 60); scene.add(key);
    const rim = new THREE.DirectionalLight(0x9fb8ff, 0.35); rim.position.set(-50, 30, -40); scene.add(rim);
    const ground = buildGround(260); scene.add(ground.group);
    const s = st.current;
    Object.assign(s, { renderer, scene, camera, ground, visible: true, dirty: true, t: 1, tween: null,
      orbit: { az: 0.75, el: 0.22, dist: 60, target: new THREE.Vector3() }, engR: 3, carR: 25, engC: [0, 0, 0], carC: [0, 6, 0], dEng: 10, dCar: 60, minDist: 3, maxDist: 100 });
    let drag: any = null;
    const down = (e: any) => { drag = { x: e.clientX, y: e.clientY }; try { el.setPointerCapture(e.pointerId); } catch (_) { } el.style.cursor = 'grabbing'; };
    const move = (e: any) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
      s.orbit.az -= dx * 0.008; s.orbit.el = Math.max(-0.15, Math.min(1.45, s.orbit.el + dy * 0.006)); s.dirty = true;
    };
    const up = () => { drag = null; el.style.cursor = 'grab'; };
    const wheel = (e: any) => { e.preventDefault(); s.tween = null; s.orbit.dist = Math.max(s.minDist, Math.min(s.maxDist, s.orbit.dist * Math.exp(e.deltaY * 0.0012))); s.dirty = true; };
    el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', wheel, { passive: false });
    const resize = () => {
      const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      if (s.model) { const t = s.t; computeDists(s); s.orbit.dist = distForT(s, t); }
      s.dirty = true;
    };
    const rObs = new ResizeObserver(resize); rObs.observe(host); resize();
    const io = new IntersectionObserver(es => { s.visible = es[0].isIntersecting; s.dirty = true; }, { threshold: 0.01 }); io.observe(host);
    const unsub = crankBus.sub(() => { s.dirty = true; });
    let raf = 0, last = performance.now();
    const stageName = (t: number) => t > 0.82 ? 'Vue extérieure' : t > 0.12 ? 'Carrosserie transparente' : 'Moteur isolé';
    const loop = (now: number) => {
      raf = requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      const Lv = live.current;
      if (!s.visible || document.hidden || !s.model) return;
      if (Lv.playing) crankBus.set(crankBus.angle + Lv.speedDeg * dt);
      if (s.tween) {
        const k = Math.min(1, (now - s.tween.t0) / s.tween.dur), e = k * k * (3 - 2 * k);
        s.orbit.dist = Math.exp(Math.log(s.tween.from) + (Math.log(s.tween.to) - Math.log(s.tween.from)) * e);
        if (k >= 1) s.tween = null;
        s.dirty = true;
      }
      if (!s.dirty) return;
      s.dirty = false;
      s.model.update(crankBus.angle, Lv.res, Lv.inp);
      const o = s.orbit;
      const t = clamp01(Math.log(o.dist / s.dEng) / Math.log(s.dCar / s.dEng)), sm = smooth01(t);
      if (Math.abs(t - s.t) > 1e-4) {
        s.t = t;
        const z = zoomRef.current; if (z && document.activeElement !== z) z.value = String(Math.round((1 - t) * 100));
        const sl = stageTxtRef.current; if (sl) sl.textContent = stageName(t);
      }
      s.vehicle.setFade(t); s.ground.setFade(t);
      o.target.set(s.engC[0] + (s.carC[0] - s.engC[0]) * sm, s.engC[1] + (s.carC[1] - s.engC[1]) * sm, s.engC[2] + (s.carC[2] - s.engC[2]) * sm);
      const ce = Math.cos(o.el);
      camera.position.set(o.target.x + o.dist * ce * Math.sin(o.az), Math.max(0.4, o.target.y + o.dist * Math.sin(o.el)), o.target.z + o.dist * ce * Math.cos(o.az));
      camera.lookAt(o.target);
      renderer.render(scene, camera);
      drawLabels();
    };
    const v = new THREE.Vector3();
    const drawLabels = () => {
      const box = labelBoxRef.current; if (!box) return;
      const Lv = live.current;
      const w = box.clientWidth, h = box.clientHeight;
      const showParts = Lv.showLabels && s.t < 0.35, showTags = s.t < 0.62;
      const items = box.querySelectorAll('[data-k]');
      for (let i = 0; i < items.length; i++) {
        const it = items[i], kk = it.getAttribute('data-k'), a = s.model.anchors[kk];
        const isTag = /^c\d+$/.test(kk);
        if (!a || (isTag ? !showTags : !showParts)) { it.style.display = 'none'; continue; }
        a.getWorldPosition(v); v.project(camera);
        if (v.z > 1 || Math.abs(v.x) > 1.05 || Math.abs(v.y) > 1.05) { it.style.display = 'none'; continue; }
        it.style.display = '';
        it.style.transform = `translate(${((v.x * 0.5 + 0.5) * w).toFixed(1)}px, ${((-v.y * 0.5 + 0.5) * h).toFixed(1)}px)`;
        if (isTag) {
          const ci = Number(kk.slice(1)) - 1;
          it.setAttribute('data-s', String(strokeOf(crankBus.angle - (Lv.phases[ci] || 0))));
          it.setAttribute('data-f', ci === Lv.focus ? '1' : '0');
        }
      }
    };
    raf = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(raf); rObs.disconnect(); io.disconnect(); unsub();
      el.removeEventListener('pointerdown', down); el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.removeEventListener('wheel', wheel);
      if (s.vehicle) { scene.remove(s.vehicle.group); s.vehicle.dispose(); s.vehicle = null; }
      if (s.model) { s.model.dispose(); s.model = null; }
      renderer.dispose(); if (el.parentNode) el.parentNode.removeChild(el);
    };
  }, []);

  /* reconstruction du moteur et du véhicule quand la géométrie, l'architecture ou le véhicule change */
  const geoKey = [inp.boreMm, inp.strokeMm, inp.rodMm, inp.eps, inp.fuel, inp.layout, inp.angle, inp.nCyl, inp.firing.join('-'), inp.hotV, inp.numbering, inp.ohv,
    car.model, car.body, car.mount, car.drive].join('|');
  useEffect(() => {
    const s = st.current; if (!s.scene) return;
    const first = !s.model;
    const tPrev = s.t;
    if (s.vehicle) { s.scene.remove(s.vehicle.group); s.vehicle.dispose(); s.vehicle = null; }
    if (s.model) { s.model.dispose(); s.model = null; }
    try {
      const m = buildEngineModel(inp, res);
      const veh = buildVehicle(car, { lo: m.lo, hi: m.hi, center: m.center });
      m.root.position.z = veh.off; veh.yawG.add(m.root);
      s.scene.add(veh.group); s.model = m; s.vehicle = veh; m.setGhost(ghost);
      s.engC = veh.engCenterCar; s.carC = veh.center; s.engR = m.radius; s.carR = veh.radius;
      s.ground.fit(veh.L, veh.Wh);
      computeDists(s);
      s.orbit.dist = distForT(s, first ? 1 : tPrev);
      s.t = -1; s.dirty = true; setErr(null);
    } catch (e: any) { setErr('Construction de la scène 3D impossible : ' + (e && e.message ? e.message : e)); }
  }, [geoKey]);
  useEffect(() => { const s = st.current; if (s.model) s.model.setGhost(ghost); s.dirty = true; }, [ghost]);
  useEffect(() => { st.current.dirty = true; }, [res, showLabels]);

  /* lectures instantanées du cylindre suivi */
  useEffect(() => {
    const k = makeKin(inp, res);
    const set = (key: string, txt: string) => { const el = ro[key].current; if (el) el.textContent = txt; };
    const upd = (th: number) => {
      const c = cycleAt(res, k, th);
      set('th', fmt(th, 0)); set('stroke', STROKES[c.stroke]);
      set('pos', fmt((k.L + k.r - pinHeight(k, th)) * 1000, 1));
      const vp = pistonVelocity(k, th, inp.rpm); set('vp', `${vp >= 0 ? '▲' : '▼'} ${fmt(Math.abs(vp), 1)}`);
      set('V', fmt(c.V * 1e6, 1)); set('P', fmt(c.P / 1e5, 2));
      set('T', Number.isFinite(c.T) ? fmt(c.T, 0) : '— gaz expulsés');
      const dIn = inp.ohv ? 0.48 : VALVE_RATIO.dIn, dEx = inp.ohv ? 0.4 : VALVE_RATIO.dEx;
      set('li', fmt(liftFrac(th, TIMING.ivo, TIMING.inDur) * VALVE_RATIO.lift * dIn * inp.boreMm, 2));
      set('le', fmt(liftFrac(th, TIMING.evo, TIMING.exDur) * VALVE_RATIO.lift * dEx * inp.boreMm, 2));
      const sl = sliderRef.current; if (sl && document.activeElement !== sl) sl.value = String(Math.round(crankBus.angle) % 720);
    };
    upd(crankBus.local());
    return crankBus.sub(upd);
  }, [res, inp]);

  const goTo = (t: number) => { const s = st.current; if (!s.model) return; s.tween = { from: s.orbit.dist, to: distForT(s, t), t0: performance.now(), dur: reduce ? 1 : 900 }; s.dirty = true; };
  const orbitBy = (f: (o: any, s: any) => void) => { const s = st.current; if (!s.orbit) return; s.tween = null; f(s.orbit, s); s.dirty = true; };
  const labelDefs: [string, string][] = [
    ['crank', 'Vilebrequin'], ['rod', 'Bielle cyl. 1'], ['piston', 'Piston cyl. 1'], ['chamber', 'Chambre de combustion'],
    ['vin', "Soupapes d'admission"], ['vex', "Soupapes d'échappement"],
    ['camIn', inp.ohv ? 'Arbre à cames central (bloc)' : 'AAC admission'], ['camEx', 'AAC échappement'],
    ['pushrod', 'Tiges de culbuteurs'], ['rocker', 'Culbuteurs'],
    ['plug', inp.fuel === 'essence' ? "Bougie d'allumage" : 'Injecteur'], ['belt', inp.nCyl > 4 || inp.layout !== 'I' ? 'Chaîne de distribution' : 'Courroie de distribution'],
  ];
  const cm = 2 * inp.strokeMm / 1000 * inp.rpm / 60;
  const row = (label: string, k: string, unit?: string, n?: 'I' | 'E') => (
    <div key={k} className="flex items-baseline justify-between gap-2 text-[12.5px] py-[3px]">
      <span className="text-muted flex items-center gap-1.5">{label}{n && <NatureChip n={n} />}</span>
      <span className="mono text-right"><span ref={ro[k]}>—</span>{unit && <span className="text-muted"> {unit}</span>}</span>
    </div>
  );
  const interval = 720 / inp.nCyl;

  return (
    <section className="card overflow-hidden" aria-label="Animation 3D du véhicule et du moteur">
      <div className="p-4 flex flex-wrap items-center justify-between gap-3">
        <div className="min-w-0">
          <h2 className="disp text-[22px] font-semibold leading-tight">Banc 3D · {car.model}</h2>
          <p className="text-[12.5px] text-muted">{layoutLabel(inp.layout, inp.nCyl, inp.angle, inp.hotV)} {MOUNT_LABEL[car.mount]}, {DRIVE_LABEL[car.drive]} · un allumage tous les {fmtTick(interval)}°V. Molette ou curseur pour traverser la carrosserie jusqu'au moteur.</p>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <button type="button" className="btn btn-primary" onClick={() => setPlaying(p => !p)} aria-pressed={playing}>
            {playing ? <IcPause /> : <IcPlay />}{playing ? 'Pause' : 'Lecture'}
          </button>
          <div className="w-[200px]"><Seg label="Vitesse de lecture" value={speed} onChange={setSpeed} options={[{ value: 'lent', label: 'Lent' }, { value: 'normal', label: 'Normal' }, { value: 'rapide', label: 'Rapide' }]} /></div>
        </div>
      </div>
      <div className="grid lg:grid-cols-[minmax(0,1fr)_270px]">
        <div className="stage h-[440px] sm:h-[560px]">
          <div ref={hostRef} className="absolute inset-0" />
          <div ref={labelBoxRef} className="labels" aria-hidden="true">
            {labelDefs.map(([k, t]) => <div key={k} data-k={k} className="lbl"><i /><span>{t}</span></div>)}
            {Array.from({ length: inp.nCyl }, (_, i) => <div key={'c' + i} data-k={'c' + (i + 1)} className="ctag" data-s="0" data-f="0">{i + 1}</div>)}
          </div>
          {err && <div className="absolute inset-0 grid place-items-center p-6 text-center text-[13px]" style={{ color: 'var(--stage-ink)' }}>{err}</div>}
          <div className="absolute left-3 top-3 right-3 flex flex-wrap items-start justify-between gap-2 pointer-events-none">
            <div className="stage-chip mono" ref={stageTxtRef}>Vue extérieure</div>
            <div className="stage-chip mono hidden sm:block">{inp.nCyl} cyl. · 4 temps · 720° par cycle</div>
          </div>
          <div className="absolute left-3 bottom-3 right-[130px] flex items-center gap-2 zoombar">
            <button type="button" className="stage-pill" onClick={() => goTo(1)}>Véhicule</button>
            <input ref={zoomRef} id="zoom-level" type="range" min={0} max={100} step={1} defaultValue={0} aria-label="Approche du moteur" className="flex-1 min-w-[60px] max-w-[220px]"
              onInput={(e: any) => { const s = st.current; if (!s.model) return; s.tween = null; s.orbit.dist = distForT(s, 1 - Number(e.target.value) / 100); s.dirty = true; }} />
            <button type="button" className="stage-pill" onClick={() => goTo(0)}>Moteur</button>
          </div>
          <div className="absolute right-3 bottom-3 flex gap-1.5">
            <button type="button" className="stage-btn" aria-label="Zoomer" onClick={() => orbitBy((o, s) => { o.dist = Math.max(s.minDist, o.dist * 0.8); })}><IcPlus /></button>
            <button type="button" className="stage-btn" aria-label="Dézoomer" onClick={() => orbitBy((o, s) => { o.dist = Math.min(s.maxDist, o.dist * 1.25); })}><IcMinus /></button>
            <button type="button" className="stage-btn" aria-label="Revenir à l'angle de vue initial" onClick={() => orbitBy(o => { o.az = 0.75; o.el = 0.22; })}><IcRotate /></button>
          </div>
        </div>
        <div className="p-4 flex flex-col gap-3 border-t lg:border-t-0 lg:border-l" style={{ borderColor: 'var(--line)' }}>
          <div className="flex items-end justify-between gap-2">
            <div className="min-w-0">
              <div className="eyebrow">Cylindre {fc + 1} · temps en cours</div>
              <div className="disp text-[24px] font-semibold leading-tight" ref={ro.stroke}>—</div>
            </div>
            {inp.nCyl > 1 && <select id="focus-cyl" className="sel w-[72px]" aria-label="Cylindre suivi" value={fc} onChange={(e: any) => setFocus(Number(e.target.value))}>
              {Array.from({ length: inp.nCyl }, (_, i) => <option key={i} value={i}>Cyl. {i + 1}</option>)}
            </select>}
          </div>
          {inp.nCyl > 1 && <FiringStrip firing={inp.firing} phases={phases} focus={fc} onFocus={setFocus} />}
          <div className="flex flex-col">
            {row(`Angle local θ${fc + 1}`, "th", "°V")}
            {row("Course depuis le PMH", "pos", "mm")}
            {row(`Vitesse piston à ${fmt(inp.rpm, 0)} tr/min`, "vp", "m/s")}
            {row("Volume V", "V", "cm³", "E")}
            {row("Pression P", "P", "bar", "I")}
            {row("Température T", "T", "K", "I")}
            {row("Levée admission", "li", "mm")}
            {row("Levée échappement", "le", "mm")}
          </div>
          <Readout label="Vitesse moyenne C_m = 2SN/60" value={fmt(cm, 1)} unit="m/s" />
          <div className="flex flex-col gap-1">
            <div className="text-[11.5px] text-muted">Couleur des gaz selon T (cycle calculé)</div>
            <div className="h-2.5 rounded-sm" style={{ background: GAS_GRADIENT }} />
            <div className="mono flex justify-between text-[10.5px] text-muted"><span>300 K</span><span>1 800 K</span><span>3 300 K</span></div>
          </div>
          <div className="flex flex-wrap gap-2">
            <button type="button" className="toggle" aria-pressed={ghost} onClick={() => setGhost(g => !g)}>Moteur en coupe</button>
            <button type="button" className="toggle" aria-pressed={showLabels} onClick={() => setShowLabels(l => !l)}>Étiquettes</button>
          </div>
        </div>
      </div>
      <div className="p-4 rule flex flex-col gap-3">
        <div className="flex items-center gap-3">
          <label htmlFor="crank-angle" className="text-[12.5px] font-medium text-muted whitespace-nowrap">Vilebrequin θ (réf. cyl. 1)</label>
          <input ref={sliderRef} id="crank-angle" type="range" min={0} max={719} step={1} defaultValue={0} className="flex-1 min-w-0"
            onInput={(e: any) => { setPlaying(false); crankBus.set(Number(e.target.value)); }} />
        </div>
        <StrokeBand cyl={fc + 1} onSeek={() => setPlaying(false)} />
      </div>
    </section>
  );
}

/* ---------- Sélecteur de moteurs ---------- */
const IcSearch = () => <Ico><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></Ico>;
const ARCH_FILTERS: { value: string; label: string; test: (s: EngineSpec) => boolean }[] = [
  { value: 'all', label: 'Toutes architectures', test: () => true },
  { value: 'l3', label: '3 cylindres', test: s => s.n === 3 },
  { value: 'l4', label: '4 cylindres', test: s => s.n === 4 },
  { value: 'l5', label: '5 cylindres', test: s => s.n === 5 },
  { value: 'l6', label: '6 cyl. en ligne', test: s => s.layout === 'I' && s.n === 6 },
  { value: 'v6', label: 'V6 et VR6', test: s => (s.layout === 'V' || s.layout === 'VR') && s.n === 6 },
  { value: 'v8', label: 'V8', test: s => s.layout === 'V' && s.n === 8 },
  { value: 'v10', label: 'V10', test: s => s.n === 10 },
  { value: 'v12', label: 'V12 et W12', test: s => s.n === 12 },
  { value: 'w16', label: 'W16', test: s => s.n === 16 },
  { value: 'flat', label: 'Boxer (à plat)', test: s => s.layout === 'B' },
];
const norm = (t: string) => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

function EnginePicker({ selected, modified, onPick }: { selected: string | null; modified: boolean; onPick: (sp: EngineSpec) => void }) {
  const [q, setQ] = useState('');
  const [maker, setMaker] = useState('all');
  const [fuel, setFuel] = useState<'all' | FuelKind>('all');
  const [arch, setArch] = useState('all');
  const list = useMemo(() => {
    const words = norm(q).split(/\s+/).filter(Boolean);
    const at = ARCH_FILTERS.find(a => a.value === arch)!.test;
    const mk = (s: EngineSpec) => maker === 'all' || (maker.startsWith('fam:') ? s.fam === maker.slice(4) : s.brand === maker.slice(6));
    return CATALOG.filter(s => mk(s) && (fuel === 'all' || s.fuel === fuel) && at(s) &&
      words.every(w => norm(`${s.brand} ${s.code} ${s.name} ${s.apps} ${s.car || ''} ${layoutBadge(s.layout, s.n)} ${s.ps}ch ${s.fuel}`).includes(w)))
      .sort((a, b) => BRAND_ORDER.indexOf(a.brand) - BRAND_ORDER.indexOf(b.brand) || a.n - b.n || a.ps - b.ps);
  }, [q, maker, fuel, arch]);
  const brands = Array.from(new Set(list.map(s => s.brand)));
  return (
    <div className="flex flex-col gap-2.5">
      <div className="field">
        <span className="pl-2 text-muted"><IcSearch /></span>
        <input id="engine-search" type="search" placeholder="Code, modèle, véhicule… (ex. 208, F40, RS6, B58)" value={q} onChange={e => setQ(e.target.value)} aria-label="Rechercher un moteur" style={{ fontFamily: 'var(--f-body)' }} />
      </div>
      <select id="filter-maker" className="sel" aria-label="Constructeur" value={maker} onChange={(e: any) => setMaker(e.target.value)}>
        <option value="all">Tous les constructeurs ({CATALOG.length})</option>
        <optgroup label="Groupes">
          {(Object.keys(FAMILY_LABEL) as Family[]).map(f => <option key={f} value={'fam:' + f}>{FAMILY_LABEL[f]} ({CATALOG.filter(c => c.fam === f).length})</option>)}
        </optgroup>
        <optgroup label="Marques">
          {BRAND_ORDER.filter(b => CATALOG.some(c => c.brand === b)).map(b => <option key={b} value={'brand:' + b}>{b} ({CATALOG.filter(c => c.brand === b).length})</option>)}
        </optgroup>
      </select>
      <div className="grid grid-cols-2 gap-2">
        <select id="filter-fuel" className="sel" aria-label="Carburant" value={fuel} onChange={(e: any) => setFuel(e.target.value)}>
          <option value="all">Essence et diesel</option><option value="essence">Essence</option><option value="diesel">Diesel</option>
        </select>
        <select id="filter-arch" className="sel" aria-label="Architecture" value={arch} onChange={(e: any) => setArch(e.target.value)}>
          {ARCH_FILTERS.map(a => <option key={a.value} value={a.value}>{a.label}</option>)}
        </select>
      </div>
      <div className="flex items-center justify-between text-[11.5px] text-muted">
        <span>{list.length} moteur{list.length > 1 ? 's' : ''} sur {CATALOG.length}</span>
        {(q || maker !== 'all' || fuel !== 'all' || arch !== 'all') && <button type="button" className="underline" onClick={() => { setQ(''); setMaker('all'); setFuel('all'); setArch('all'); }}>Effacer les filtres</button>}
      </div>
      <div className="elist" role="listbox" aria-label="Catalogue moteurs">
        {list.length === 0 && <div className="p-4 text-[13px] text-muted">Aucun moteur ne correspond. Essayez un code (EA888, EB2, F154) ou un modèle (Golf, 208, 488, M3).</div>}
        {brands.map(br => (
          <div key={br}>
            <div className="ebrand">{br}</div>
            {list.filter(s => s.brand === br).map(s => (
              <button key={s.id} type="button" role="option" aria-selected={selected === s.id} className="erow" onClick={() => onPick(s)}>
                <span className="ebadge mono" data-f={s.fuel}>{layoutBadge(s.layout, s.n)}</span>
                <span className="min-w-0 flex-1">
                  <span className="flex items-baseline justify-between gap-2">
                    <span className="font-semibold text-[13.5px] truncate">{s.name}</span>
                    <span className="mono text-[12px] whitespace-nowrap">{s.ps} ch</span>
                  </span>
                  <span className="block text-[11.5px] text-muted truncate">{s.code} · {s.car || s.apps}</span>
                </span>
              </button>
            ))}
          </div>
        ))}
      </div>
      {selected && modified && <p className="text-[12px] text-muted flex items-center gap-1.5"><IcRotate /> Valeurs modifiées : recliquez le moteur pour recharger sa fiche.</p>}
    </div>
  );
}

function SpecCard({ sp, res, inp }: { sp: EngineSpec; res?: EngineResult; inp?: EngineInputs }) {
  const cc = Math.PI / 4 * sp.bore * sp.bore * sp.stroke * sp.n / 1000;
  const peEst = res ? res.powerCh * QUALITY[sp.fuel] : NaN;
  const rows: [string, string][] = [
    ['Architecture', layoutLabel(sp.layout, sp.n, sp.angle, sp.hotV)],
    ['Cylindrée', `${fmt(sp.cc, 0)} cm³ (calc. ${fmt(cc, 0)})`],
    ['Alésage × course', `${fmt(sp.bore, 1)} × ${fmt(sp.stroke, 1)} mm`],
    ['Bielle', sp.rod ? `${fmt(sp.rod, 1)} mm` : `${fmt(sp.stroke * 1.62, 1)} mm (estimée)`],
    ['Taux de compression', `${fmt(sp.eps, 1)} : 1`],
    ['Alimentation', sp.ind],
    ['Puissance', `${sp.ps} ch à ${sp.rpmTxt} tr/min`],
    ['Couple', `${fmt(sp.nm, 0)} N·m`],
    ['Puissance spécifique', `${fmt(sp.ps / (sp.cc / 1000), 1)} ch/L`],
    ['Ordre d\'allumage', (sp.firing || defaultFiring(sp.layout, sp.n)).join('-') + (sp.firing && !sp.firingTyp ? '' : ' (type)')],
    ['Implantation', sp.mount ? `${MOUNT_LABEL[sp.mount]}, ${DRIVE_LABEL[sp.drive || 'FWD']}` : '—'],
  ];
  return (
    <div className="spec">
      <div className="flex items-baseline justify-between gap-2">
        <div className="min-w-0">
          <div className="eyebrow">{sp.brand} · {sp.years}</div>
          <div className="disp text-[21px] font-semibold leading-tight">{sp.name}</div>
          <div className="text-[12px] text-muted">{sp.code} · {sp.apps}</div>
        </div>
        <span className="ebadge mono" data-f={sp.fuel}>{layoutBadge(sp.layout, sp.n)}</span>
      </div>
      <dl className="flex flex-col mt-2">
        {rows.map(([k, v]) => <div key={k} className="flex justify-between gap-3 text-[12px] py-[3px] border-b" style={{ borderColor: 'var(--grid)' }}><dt className="text-muted whitespace-nowrap">{k}</dt><dd className="mono text-right">{v}</dd></div>)}
      </dl>
      {res && inp && <p className="text-[11.5px] text-muted mt-2">P₁ = {fmt(inp.p1Bar, 2)} bar calée pour que Pe ≈ {fmt(QUALITY[sp.fuel], 2)} × P<sub>i</sub> retrouve la puissance constructeur. Estimation actuelle : <span className="mono">{fmt(peEst, 0)} ch</span> effectifs.</p>}
    </div>
  );
}

/* ---------- Application ---------- */
function App() {
  const [form, setForm] = useState<FormState>(() => specToForm(CATALOG.find(c => c.id === DEFAULT_SPEC) || CATALOG[0]));
  const [tab2, setTab2] = useState<'ts' | 'flow'>('ts');
  const [tab3, setTab3] = useState<'int' | 'ext' | 'proc'>('int');
  const lastGood = useRef<{ res: EngineResult; inp: EngineInputs } | null>(null);

  const { inputs, errors } = useMemo(() => validate(form), [form]);
  const computed = useMemo(() => {
    if (!inputs) return null;
    try { const res = computeEngine(inputs); return resultIsFinite(res) ? { res, inp: inputs } : null; } catch (e) { return null; }
  }, [inputs]);
  if (computed) lastGood.current = computed;
  const view = computed ?? lastGood.current;
  const stale = !computed;

  const touch = (f: FormState) => setForm({ ...f, modified: true });
  const setRaw = (k: FieldKey, v: string) => {
    const next = { ...form, raw: { ...form.raw, [k]: v } };
    if (k === 'nCyl') { const n = num(v); if (Number.isInteger(n) && n >= 1 && n <= 16 && !layoutCheck(form.layout, n)) next.firing = defaultFiring(form.layout, n).join('-'); }
    touch(next);
  };
  const setLayout = (l: Layout) => {
    const n = num(form.raw.nCyl);
    const ok = Number.isInteger(n) && n >= 1 && !layoutCheck(l, n);
    touch({ ...form, layout: l, hotV: l === 'V' ? form.hotV : false, numbering: 'std', raw: { ...form.raw, angle: frNum(ANGLE_DEFAULT[l], 1) }, firing: ok ? defaultFiring(l, n).join('-') : form.firing });
  };
  const resetFiring = () => { const n = num(form.raw.nCyl); if (Number.isInteger(n) && n >= 1 && !layoutCheck(form.layout, n)) touch({ ...form, firing: defaultFiring(form.layout, n).join('-') }); };
  const applySpec = (sp: EngineSpec) => setForm(specToForm(sp));
  const spec = form.specId ? CATALOG.find(c => c.id === form.specId) || null : null;
  const carInfo: CarInfo = spec && spec.car
    ? { model: spec.car, body: spec.body || 'sedan', mount: spec.mount || 'FL', drive: spec.drive || 'RWD', brand: spec.brand }
    : { model: 'Berline d\'étude', body: 'sedan', mount: 'FL', drive: 'RWD', brand: '' };
  const setFuel = (f: FuelKind) => touch({ ...form, fuel: f, raw: { ...form.raw, pciMJ: FUEL_DEFAULTS[f].pci, afrSt: FUEL_DEFAULTS[f].afr } });
  const setRichMode = (m: 'lambda' | 'phi') => {
    if (m === form.richMode) return;
    const v = num(form.raw.rich);
    const conv = Number.isFinite(v) && v > 0 ? (1 / v).toLocaleString('fr-FR', { maximumFractionDigits: 3 }) : form.raw.rich;
    setForm({ ...form, richMode: m, raw: { ...form.raw, rich: conv } });
  };

  const res = view?.res, inp = view?.inp;
  const errCount = Object.keys(errors).length;

  return (
    <div className="wrap flex flex-col gap-5">
      <header className="flex flex-wrap items-end justify-between gap-4 pb-1">
        <div className="min-w-0">
          <div className="eyebrow">Simulation thermodynamique · moteur à combustion interne 4 temps</div>
          <h1 className="disp text-[clamp(34px,5vw,52px)] font-bold leading-[0.95] uppercase tracking-[0.01em] mt-1">Banc Cycle MCI</h1>
          <p className="mono text-[12.5px] text-muted mt-2">
            {res && inp ? <>
              {spec ? `${spec.brand} ${spec.name}${form.modified ? ' (modifié)' : ''}` : 'Configuration personnalisée'} · {fmt(res.Vtot * 1e6, 0)} cm³ · {layoutLabel(inp.layout, inp.nCyl, inp.angle, inp.hotV)} · ε {fmt(inp.eps, 1)} · {inp.cycle === 'otto' ? 'Otto (isochore)' : inp.cycle === 'diesel' ? 'Diesel (isobare)' : `Sabathé x = ${fmt(res.xv * 100, 0)} %`} · γ {fmt(res.gamma, 3)}
            </> : '—'}
          </p>
        </div>
        <div className="flex items-center gap-3 text-[12px] text-muted">
          <span className="inline-flex items-center gap-1.5"><NatureChip n="I" /> intensive</span>
          <span className="inline-flex items-center gap-1.5"><NatureChip n="E" /> extensive</span>
          <span className="inline-flex items-center gap-1.5"><NatureChip n="G" /> géométrie</span>
        </div>
      </header>

      <div className="grid gap-5 lg:grid-cols-[350px_minmax(0,1fr)] items-start">
        {/* ----- Consignes ----- */}
        <aside className="card p-4 flex flex-col gap-4" aria-label="Paramètres du moteur">
          <div className="flex items-center gap-2"><IcCog /><h2 className="disp text-[20px] font-semibold">Consignes</h2></div>
          <Section title="Catalogue moteurs">
            <EnginePicker selected={form.specId} modified={form.modified} onPick={applySpec} />
            {spec && <SpecCard sp={spec} res={form.modified ? undefined : res} inp={form.modified ? undefined : inp} />}
          </Section>

          <Section title="Carburant & cycle">
            <Seg label="Carburant" value={form.fuel} onChange={setFuel} options={[{ value: 'essence', label: 'Essence' }, { value: 'diesel', label: 'Diesel' }]} />
            <Seg label="Modèle de cycle" value={form.cycle} onChange={(c: CycleKind) => touch({ ...form, cycle: c })}
              options={[{ value: 'otto', label: 'Otto' }, { value: 'diesel', label: 'Diesel' }, { value: 'sabathe', label: 'Sabathé' }]} />
            <Field k="xvPct" form={form} setRaw={setRaw} error={errors.xvPct} disabled={form.cycle !== 'sabathe'}
              labelOverride={form.cycle === 'sabathe' ? 'Part isochore x de Q_in' : form.cycle === 'otto' ? 'Part isochore (Otto : 100 %)' : 'Part isochore (Diesel : 0 %)'} />
          </Section>

          <Section title="Géométrie">
            <div className="grid grid-cols-2 gap-3">
              <Field k="boreMm" form={form} setRaw={setRaw} error={errors.boreMm} />
              <Field k="strokeMm" form={form} setRaw={setRaw} error={errors.strokeMm} />
              <Field k="rodMm" form={form} setRaw={setRaw} error={errors.rodMm} />
              <Field k="eps" form={form} setRaw={setRaw} error={errors.eps} />
              <Field k="nCyl" form={form} setRaw={setRaw} error={errors.nCyl} />
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div className="flex flex-col gap-1 min-w-0">
                <label htmlFor="f-layout" className="flex items-center gap-1.5 text-[12.5px] font-medium text-muted">Architecture<NatureChip n="G" /></label>
                <select id="f-layout" className="sel" value={form.layout} onChange={(e: any) => setLayout(e.target.value)}>
                  {(['I', 'V', 'VR', 'W', 'B'] as Layout[]).map(l => <option key={l} value={l}>{LAYOUT_NAME[l]}</option>)}
                </select>
              </div>
              {ANGLE_RANGE[form.layout]
                ? <Field k="angle" form={form} setRaw={setRaw} error={errors.angle} labelOverride={form.layout === 'VR' ? 'Angle du VR' : form.layout === 'W' ? 'Angle entre VR' : 'Angle du V'} />
                : <div className="flex flex-col gap-1 justify-end text-[12px] text-muted pb-2">{form.layout === 'B' ? 'Bancs opposés à 180°' : 'Cylindres verticaux'}</div>}
            </div>
            {form.layout === 'V' && <label className="flex items-center gap-2 text-[12.5px] text-muted cursor-pointer">
              <input id="f-hotv" type="checkbox" checked={form.hotV} onChange={e => touch({ ...form, hotV: e.target.checked })} />
              Turbos dans le V (« hot-V » : échappement côté intérieur)
            </label>}
            {(form.layout === 'I' || form.layout === 'V') && <label className="flex items-center gap-2 text-[12.5px] text-muted cursor-pointer">
              <input id="f-ohv" type="checkbox" checked={form.ohv} onChange={e => touch({ ...form, ohv: e.target.checked })} />
              Arbre à cames central, tiges et culbuteurs (OHV, 2 soupapes)
            </label>}
            <div className="flex flex-col gap-1">
              <div className="flex items-center justify-between gap-2">
                <label htmlFor="f-firing" className="text-[12.5px] font-medium text-muted">Ordre d'allumage</label>
                <button type="button" className="text-[11.5px] underline text-muted" onClick={resetFiring}>Ordre par défaut</button>
              </div>
              <div className={`field ${errors.firing ? 'bad' : ''}`}>
                <input id="f-firing" type="text" autoComplete="off" spellCheck={false} value={form.firing} aria-invalid={!!errors.firing}
                  onChange={e => touch({ ...form, firing: e.target.value })} />
              </div>
              {errors.firing && <span className="text-[11.5px] leading-tight" style={{ color: 'var(--err)' }}>{errors.firing}</span>}
            </div>
            {res && inp && <div className="flex flex-col gap-1">
              <Readout label="Cylindrée unitaire V_d" value={fmt(res.Vd * 1e6, 1)} unit="cm³" n="E" />
              <Readout label="Volume mort V_c" value={fmt(res.Vc * 1e6, 1)} unit="cm³" n="E" />
              <Readout label="Rapport course / alésage" value={fmt(inp.strokeMm / inp.boreMm, 3)} unit="" />
              <Readout label="Rapport bielle λ_b = (S/2)/L" value={fmt(inp.strokeMm / 2 / inp.rodMm, 3)} unit="" />
            </div>}
          </Section>

          <Section title="Admission & régime">
            <div className="grid grid-cols-2 gap-3">
              <Field k="p1Bar" form={form} setRaw={setRaw} error={errors.p1Bar} />
              <Field k="t1C" form={form} setRaw={setRaw} error={errors.t1C} />
              <Field k="rpm" form={form} setRaw={setRaw} error={errors.rpm} />
            </div>
            {res && <Readout label="Masse enfermée m" value={fmt(res.mAir * 1e3, 4)} unit="g/cyl" n="E" />}
          </Section>

          <Section title="Combustion" aside={<div className="w-[108px]"><Seg label="Saisie de la richesse" value={form.richMode} onChange={setRichMode} options={[{ value: 'lambda', label: 'λ' }, { value: 'phi', label: 'φ' }]} /></div>}>
            <div className="grid grid-cols-2 gap-3">
              <Field k="rich" form={form} setRaw={setRaw} error={errors.rich} labelOverride={form.richMode === 'lambda' ? 'Lambda λ' : 'Richesse φ'} />
              <Field k="pciMJ" form={form} setRaw={setRaw} error={errors.pciMJ} />
              <Field k="afrSt" form={form} setRaw={setRaw} error={errors.afrSt} />
              <Field k="etaCombPct" form={form} setRaw={setRaw} error={errors.etaCombPct} />
            </div>
            {inp && <Readout label={form.richMode === 'lambda' ? 'Richesse φ = 1/λ' : 'Lambda λ = 1/φ'} value={fmt(form.richMode === 'lambda' ? 1 / inp.lambda : inp.lambda, 3)} unit="" n="I" />}
            {res && <Readout label="Carburant m_f" value={fmt(res.mFuel * 1e6, 2)} unit="mg/cyl" n="E" />}
          </Section>

          <Section title="Gaz de travail" aside={<div className="w-[140px]"><Seg label="Mode gamma" value={form.gammaMode} onChange={(g: GammaMode) => touch({ ...form, gammaMode: g })} options={[{ value: 'auto', label: 'Estimé' }, { value: 'manuel', label: 'Manuel' }]} /></div>}>
            {form.gammaMode === 'manuel'
              ? <Field k="gamma" form={form} setRaw={setRaw} error={errors.gamma} />
              : <p className="text-[12px] text-muted">γ calculé par itération à la température moyenne des cinq états, avec c<sub>p</sub>(T) de l'air.</p>}
            {res && <div className="flex flex-col gap-1">
              <Readout label="γ retenu" value={fmt(res.gamma, 4)} unit="" n="I" />
              <Readout label="c_v · c_p" value={`${fmt(res.cv, 0)} · ${fmt(res.cp, 0)}`} unit="J/kg·K" n="I" />
            </div>}
          </Section>
        </aside>

        {/* ----- Instruments ----- */}
        <main className="flex flex-col gap-5 min-w-0">
          {errCount > 0 && <div className="note note-err" role="alert"><IcAlert /><span>
            {errCount === 1 ? 'Une saisie est invalide' : `${errCount} saisies sont invalides`} : corrigez les champs signalés en rouge.
            {lastGood.current ? ' Les résultats affichés correspondent à la dernière configuration valide.' : ''}
          </span></div>}
          {!errCount && !computed && <div className="note note-err" role="alert"><IcAlert /><span>Calcul impossible avec ces valeurs (résultat non fini). Vérifiez la géométrie et la richesse.</span></div>}

          {res && inp && <>
            <section aria-label="Indicateurs clés" className={`card ${stale ? 'opacity-60' : ''}`}>
              <div className="grid grid-cols-1 sm:grid-cols-3">
                {[
                  { ic: <IcZap />, label: 'Puissance indiquée', v: fmt(res.powerKW, 1), u: 'kW', sub: `${fmt(res.powerCh, 0)} ch · ${fmt(inp.rpm, 0)} tr/min${spec ? ` · constructeur ${spec.ps} ch eff.` : ''}`, n: 'E' as const },
                  { ic: <IcFlame />, label: 'Rendement thermique', v: fmt(res.etaTh * 100, 1), u: '%', sub: `Otto équiv. 1−ε^(1−γ) : ${fmt(res.etaOttoRef * 100, 1)} %`, n: 'I' as const },
                  { ic: <IcGauge />, label: 'PMI', v: fmt(res.pmiBar, 2), u: 'bar', sub: `W_net ${fmt(res.Wnet, 0)} J/cycle/cyl`, n: 'I' as const },
                ].map((k, i) => (
                  <div key={k.label} className={`p-4 flex flex-col gap-2 ${i > 0 ? 'border-t sm:border-t-0 sm:border-l' : ''}`} style={{ borderColor: 'var(--line)' }}>
                    <div className="flex items-center gap-1.5 eyebrow">{k.ic}{k.label}<NatureChip n={k.n} /></div>
                    <div className="kpi-val">{k.v}<span className="kpi-unit">{k.u}</span></div>
                    <div className="mono text-[12px] text-muted">{k.sub}</div>
                  </div>
                ))}
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 rule">
                {[
                  ['Couple indiqué', fmt(res.torqueNm, 0), 'N·m'],
                  ['Conso. spécifique ind.', fmt(res.isfc, 0), 'g/kWh'],
                  ['P max', fmt(res.pmaxBar, 1), 'bar'],
                  ['T max', fmt(res.tmaxK, 0), 'K'],
                ].map(([l, v, u], i) => (
                  <div key={l} className={`px-4 py-3 ${i % 2 ? 'border-l' : ''} ${i === 2 ? 'md:border-l' : ''} ${i >= 2 ? 'border-t md:border-t-0' : ''}`} style={{ borderColor: 'var(--line)' }}>
                    <div className="text-[11.5px] text-muted">{l}</div>
                    <div className="mono text-[17px] font-medium">{v} <span className="text-[12px] text-muted font-normal">{u}</span></div>
                  </div>
                ))}
              </div>
            </section>

            {res.warnings.length > 0 && <div className="flex flex-col gap-2">
              {res.warnings.map((w, i) => <div key={i} className={`note ${w.level === 'warn' ? 'note-warn' : 'note-info'}`}>{w.level === 'warn' ? <IcAlert /> : <IcInfo />}<span>{w.text}</span></div>)}
            </div>}

            <div className={stale ? 'opacity-60' : ''}><Engine3D res={res} inp={inp} car={carInfo} /></div>
            {spec && spec.txt && <TechDossier sp={spec} />}

            <div className={`grid gap-5 2xl:grid-cols-2 ${stale ? 'opacity-60' : ''}`}>
              <PVChart res={res} inp={inp} />
              <div className="card p-4 flex flex-col gap-3 min-w-0">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <h2 className="disp text-[22px] font-semibold leading-tight">{tab2 === 'ts' ? 'Diagramme T-s' : 'Synoptique énergétique'}</h2>
                  <div className="w-[220px]"><Seg role="tab" label="Vue énergétique" value={tab2} onChange={setTab2} options={[{ value: 'ts', label: 'T-s' }, { value: 'flow', label: 'Flux d\'énergie' }]} /></div>
                </div>
                {tab2 === 'ts' ? <TsChart res={res} /> : <EnergyFlow res={res} />}
              </div>
            </div>

            <section className={`card p-4 flex flex-col gap-4 ${stale ? 'opacity-60' : ''}`} aria-label="Tableaux de résultats">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h2 className="disp text-[22px] font-semibold leading-tight flex items-center gap-2"><IcActivity />Points d'état et bilans</h2>
                  <p className="text-[12.5px] text-muted">Valeurs par cylindre et par cycle. Rapport de détente préalable ρ = V₄/V₃ = {fmt(res.rc, 3)} · rapport de pression α = P₃/P₂ = {fmt(res.alphaP, 3)}</p>
                </div>
                <div className="w-full sm:w-[380px]"><Seg role="tab" label="Type de grandeurs" value={tab3} onChange={setTab3}
                  options={[{ value: 'int', label: 'Intensives' }, { value: 'ext', label: 'Extensives' }, { value: 'proc', label: 'Transformations' }]} /></div>
              </div>
              {tab3 === 'int' && <IntensiveTable res={res} />}
              {tab3 === 'ext' && <ExtensiveTable res={res} nCyl={inp.nCyl} rpm={inp.rpm} />}
              {tab3 === 'proc' && <ProcessTable res={res} />}
            </section>

            <ExportPanel res={res} inp={inp} />
          </>}

          <section className="text-[12.5px] text-muted flex flex-col gap-1.5 max-w-[80ch]">
            <h3 className="eyebrow">Hypothèses du modèle</h3>
            <p>Cycle théorique à air (gaz parfait, R = 287 J/kg·K) en système fermé, γ constant sur tout le cycle. Masse enfermée m = P₁·V₁/(R·T₁) au PMB, sans gaz résiduels ni pertes aux parois. Combustion instantanée : une fraction x de Q<sub>in</sub> à volume constant, le reste à pression constante. Q<sub>in</sub> = m<sub>f</sub>·PCI·η<sub>comb</sub>, avec m<sub>f</sub> = m/(λ·AFR) et une énergie libérée plafonnée à λ = 1 en mélange riche. Puissance et PMI sont <em>indiquées</em> (avant frottements et pompage) : attendez-vous à des valeurs effectives de 25 à 40 % inférieures.</p>
            <p>Catalogue : alésage, course, taux de compression, puissance et couple issus des fiches constructeur publiées. Quand la longueur de bielle n'est pas publiée, elle est estimée à 1,62 × S (rapport bielle/manivelle usuel de 0,31). P₁ est calée pour qu'un rapport P<sub>e</sub>/P<sub>i,théorique</sub> de {QUALITY.essence.toLocaleString('fr-FR')} (essence) ou {QUALITY.diesel.toLocaleString('fr-FR')} (diesel) retrouve la puissance annoncée au régime nominal : elle représente une pression d'admission équivalente, pas la pression de suralimentation mesurée. Les mélanges sont pris à λ = 1 (essence) et λ = 1,4 (diesel) en pleine charge.</p>
            <p>Animation 3D : cinématique bielle-manivelle exacte pour chaque cylindre, allumage équiréparti tous les 720/n °V selon l'ordre d'allumage, manetons calés en conséquence (manetons communs ou décalés sur les V). Les axes des VR et W passent par l'axe du vilebrequin (sans désaxage), et leurs culasses sont simplifiées. Les culasses à simple arbre ou à 3 et 5 soupapes sont représentées en double arbre à 4 soupapes ; seules les distributions à arbre central (OHV) sont dessinées spécifiquement.</p>
            <p>Véhicule : silhouette paramétrique par type de carrosserie (citadine, compacte, break, berline, SUV, coupé, GT à moteur central avant, supercar à moteur central arrière, 911, roadster), aux cotes moyennes de la catégorie et non à celles du modèle exact. Implantation, orientation du moteur et transmission (traction, propulsion, intégrale) suivent le modèle de référence. Diamètres et levées de soupapes, profils de cames et calage de distribution suivent des proportions types d'un 4 soupapes DOHC, pas un plan constructeur.</p>
          </section>
        </main>
      </div>
    </div>
  );
}

window.__BancApp = App;
window.__BancEngine = { buildVehicle, dossierFor, architectureNotes, FEATURES, computeEngine, validate, CATALOG, specToForm, calibrateP1, engineLayout, throwGroups, crankPinAngle, defaultFiring, parseFiring, cylinderPhases, buildExport, makeKin, cycleAt, volumeAt, pinHeight, pistonVelocity, liftFrac, TIMING };
</script>
