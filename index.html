<script type="text/plain" id="app-src">
const { useState, useMemo, useRef, useEffect } = React;
declare const THREE: any;

/* Angle de vilebrequin partagé entre l'animation 3D, la bande de distribution et le diagramme P-V */
/* angle = vilebrequin (réf. cylindre 1) ; phase = décalage du cylindre suivi ; les abonnés reçoivent l'angle local de ce cylindre */
const crankBus = {
  angle: 0, phase: 0,
  subs: new Set<(local: number, global: number) => void>(),
  local() { return ((this.angle - this.phase) % 720 + 720) % 720; },
  emit() { const l = this.local(); this.subs.forEach((f: any) => f(l, this.angle)); },
  set(a: number) { this.angle = ((a % 720) + 720) % 720; this.emit(); },
  setPhase(p: number) { this.phase = p; this.emit(); },
  sub(f: (local: number, global: number) => void) { this.subs.add(f); return () => { this.subs.delete(f); }; },
};

/* ===================== ENGINE START ===================== */
const R_AIR = 287.05;          // J/(kg·K) — constante massique de l'air
const T_REF = 298.15;          // K   — état de référence pour l'entropie
const P_REF = 101325;          // Pa

type FuelKind = 'essence' | 'diesel';
type CycleKind = 'otto' | 'diesel' | 'sabathe';
type GammaMode = 'auto' | 'manuel';

interface EngineInputs {
  fuel: FuelKind; cycle: CycleKind; gammaMode: GammaMode;
  boreMm: number; strokeMm: number; nCyl: number; eps: number;
  p1Bar: number; t1C: number; rpm: number; lambda: number;
  pciMJ: number; afrSt: number; etaCombPct: number; xvPct: number; gamma: number;
  rodMm: number;
  layout: Layout; angle: number; firing: number[]; hotV: boolean;
  numbering?: Numbering; ohv?: boolean;
}

interface StateRow {
  id: string; label: string;
  P: number; T: number; V: number;            // SI : Pa, K, m³
  v: number; u: number; h: number; s: number; // intensives : m³/kg, J/kg, J/kg, J/(kg·K)
  m: number; U: number; H: number; S: number; // extensives : kg, J, J, J/K
}
interface ProcessRow { id: string; name: string; nature: string; kind: 'w' | 'h' | 'c'; Q: number; W: number; dU: number; }
interface PathPt { V: number; P: number; T: number; s: number; seg: number; }
interface Warning { level: 'warn' | 'info'; text: string; }

interface EngineResult {
  gamma: number; cv: number; cp: number; gammaIterations: number;
  Vd: number; Vc: number; Vtot: number;
  mAir: number; mFuel: number; mFuelBurnt: number;
  Qfuel: number; Qadd: number; Qout: number; Qloss: number;
  Wnet: number; etaTh: number; etaFuel: number; etaOttoRef: number;
  pmiBar: number; powerW: number; powerKW: number; powerCh: number; torqueNm: number;
  isfc: number; airKgH: number; fuelKgH: number;
  rc: number; alphaP: number; xv: number; pmaxBar: number; tmaxK: number;
  capped: boolean;
  states: StateRow[]; processes: ProcessRow[]; path: PathPt[]; warnings: Warning[];
}

/* cp de l'air (J/kg·K) — polynôme de Çengel, valide 273–1800 K, borné au-delà */
function cpAir(T: number): number {
  const t = Math.min(Math.max(T, 250), 1800);
  return (28.11 + 0.1967e-2 * t + 0.4802e-5 * t * t - 1.966e-9 * t * t * t) / 28.97 * 1000;
}
function gammaAtT(T: number): number { const cp = cpAir(T); return cp / (cp - R_AIR); }

function solveAtGamma(inp: EngineInputs, g: number) {
  const B = inp.boreMm / 1000, S = inp.strokeMm / 1000;
  const Vd = Math.PI / 4 * B * B * S;                 // cylindrée unitaire
  const Vc = Vd / (inp.eps - 1);                      // volume mort
  const V1 = Vd + Vc, V2 = Vc;
  const P1 = inp.p1Bar * 1e5, T1 = inp.t1C + 273.15;
  const m = P1 * V1 / (R_AIR * T1);                   // masse enfermée (gaz parfait)
  const cv = R_AIR / (g - 1), cp = g * cv;
  const mFuel = m / (inp.lambda * inp.afrSt);         // carburant introduit
  const mBurnt = mFuel * Math.min(1, inp.lambda);     // plafonné par l'oxygène disponible
  const Qfuel = mFuel * inp.pciMJ * 1e6;
  const Qrel = mBurnt * inp.pciMJ * 1e6 * inp.etaCombPct / 100;
  const xv = inp.cycle === 'otto' ? 1 : inp.cycle === 'diesel' ? 0 : inp.xvPct / 100;

  const T2 = T1 * Math.pow(inp.eps, g - 1), P2 = P1 * Math.pow(inp.eps, g);
  const Qv = xv * Qrel;
  const V3 = V2, T3 = T2 + Qv / (m * cv), P3 = P2 * T3 / T2;
  let Qp = (1 - xv) * Qrel;
  let T4 = T3 + Qp / (m * cp), V4 = V3 * T4 / T3;
  const P4 = P3;
  let capped = false;
  if (V4 > V1) { capped = true; V4 = V1; T4 = T3 * V4 / V3; Qp = m * cp * (T4 - T3); }
  const V5 = V1, T5 = T4 * Math.pow(V4 / V5, g - 1), P5 = P4 * Math.pow(V4 / V5, g);
  return { Vd, Vc, V1, V2, V3, V4, V5, P1, P2, P3, P4, P5, T1, T2, T3, T4, T5, m, cv, cp, g, mFuel, mBurnt, Qfuel, Qrel, Qv, Qp, xv, capped };
}

function entropy(T: number, P: number, cp: number): number {
  return cp * Math.log(T / T_REF) - R_AIR * Math.log(P / P_REF);
}

function computeEngine(inp: EngineInputs): EngineResult {
  let g = inp.gammaMode === 'manuel' ? inp.gamma : 1.35;
  let r = solveAtGamma(inp, g);
  let iters = 0;
  if (inp.gammaMode === 'auto') {
    for (let i = 0; i < 60; i++) {
      const Tm = (r.T1 + r.T2 + r.T3 + r.T4 + r.T5) / 5;
      const gn = gammaAtT(Tm);
      iters = i + 1;
      if (Math.abs(gn - g) < 1e-7) { g = gn; r = solveAtGamma(inp, g); break; }
      g = 0.5 * g + 0.5 * gn;
      r = solveAtGamma(inp, g);
    }
  }
  const { m, cv, cp } = r;

  const base: Array<[string, string, number, number, number]> = [
    ['1', "PMB · fin d'admission", r.P1, r.T1, r.V1],
    ['2', 'PMH · fin de compression', r.P2, r.T2, r.V2],
    ['3', 'Fin de combustion isochore', r.P3, r.T3, r.V3],
    ['4', 'Fin de combustion isobare', r.P4, r.T4, r.V4],
    ['5', 'PMB · fin de détente', r.P5, r.T5, r.V5],
  ];
  const states: StateRow[] = base.map(([id, label, P, T, V]) => {
    const s = entropy(T, P, cp);
    return { id, label, P, T, V, v: V / m, u: cv * T, h: cp * T, s, m, U: m * cv * T, H: m * cp * T, S: m * s };
  });

  const processes: ProcessRow[] = [
    { id: '1→2', name: 'Compression', nature: 'isentropique', kind: 'w' as const, Q: 0, W: -m * cv * (r.T2 - r.T1) },
    { id: '2→3', name: 'Combustion', nature: 'isochore', kind: 'h' as const, Q: r.Qv, W: 0 },
    { id: '3→4', name: 'Combustion', nature: 'isobare', kind: 'h' as const, Q: r.Qp, W: r.P3 * (r.V4 - r.V3) },
    { id: '4→5', name: 'Détente', nature: 'isentropique', kind: 'w' as const, Q: 0, W: m * cv * (r.T4 - r.T5) },
    { id: '5→1', name: 'Échappement', nature: 'isochore', kind: 'c' as const, Q: -m * cv * (r.T5 - r.T1), W: 0 },
  ].map(p => ({ ...p, dU: p.Q - p.W }));

  // Discrétisation fine des transformations pour les diagrammes
  const N = 64, path: PathPt[] = [];
  const push = (V: number, P: number, T: number, seg: number) => path.push({ V: V * 1e6, P: P / 1e5, T, s: entropy(T, P, cp), seg });
  for (let i = 0; i <= N; i++) { // 1→2  P·V^γ = cte, espacement géométrique pour lisser la montée
    const V = r.V1 * Math.pow(r.V2 / r.V1, i / N);
    push(V, r.P1 * Math.pow(r.V1 / V, g), r.T1 * Math.pow(r.V1 / V, g - 1), 0);
  }
  for (let i = 0; i <= N; i++) { const T = r.T2 + (r.T3 - r.T2) * i / N; push(r.V2, r.P2 * T / r.T2, T, 1); }
  for (let i = 0; i <= N; i++) { const V = r.V3 + (r.V4 - r.V3) * i / N; push(V, r.P3, r.T3 * V / r.V3, 2); }
  for (let i = 0; i <= N; i++) {
    const V = r.V4 * Math.pow(r.V5 / r.V4, i / N);
    push(V, r.P4 * Math.pow(r.V4 / V, g), r.T4 * Math.pow(r.V4 / V, g - 1), 3);
  }
  for (let i = 0; i <= N; i++) { const T = r.T5 + (r.T1 - r.T5) * i / N; push(r.V1, r.P5 * T / r.T5, T, 4); }

  const Wnet = processes.reduce((a, p) => a + p.W, 0);
  const Qadd = r.Qv + r.Qp;
  const Qout = m * cv * (r.T5 - r.T1);
  const powerW = Wnet * inp.nCyl * inp.rpm / 120;  // 4 temps : 1 cycle pour 2 tours
  const omega = 2 * Math.PI * inp.rpm / 60;
  const pmaxBar = Math.max(r.P3, r.P4) / 1e5, tmaxK = Math.max(r.T3, r.T4);

  const warnings: Warning[] = [];
  if (r.capped) warnings.push({ level: 'warn', text: "L'apport isobare atteint le PMB : la chaleur restante n'est pas convertie. Augmentez la part isochore ou réduisez la charge." });
  if (inp.lambda < 1) warnings.push({ level: 'warn', text: `Mélange riche (λ = ${inp.lambda.toLocaleString('fr-FR')}) : ${((1 - inp.lambda) * 100).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} % du carburant ne trouve pas d'oxygène. L'énergie libérée est plafonnée à λ = 1.` });
  if (inp.fuel === 'diesel' && inp.lambda < 1.2) warnings.push({ level: 'warn', text: 'Diesel sous λ ≈ 1,2 : limite de fumée dépassée, émissions de suies probables.' });
  if (inp.fuel === 'essence' && inp.lambda > 1.5) warnings.push({ level: 'info', text: "Mélange homogène très pauvre : au-delà de λ ≈ 1,5 l'allumage commandé devient instable (ratés)." });
  if (inp.fuel === 'essence' && inp.eps > 12 && inp.p1Bar > 1.5) warnings.push({ level: 'info', text: 'Taux de compression élevé avec suralimentation : risque de cliquetis non modélisé ici.' });
  if (inp.fuel === 'diesel' && inp.eps < 13) warnings.push({ level: 'info', text: "Taux inférieur à 13 : l'auto-inflammation à froid du gazole devient difficile." });
  if (tmaxK > 2800) warnings.push({ level: 'info', text: `Tmax ≈ ${Math.round(tmaxK).toLocaleString('fr-FR')} K : au-delà de 2 500 K la dissociation de CO₂ et H₂O limite la température réelle. Le cycle à air la surestime.` });
  if (pmaxBar > 220) warnings.push({ level: 'warn', text: `Pmax théorique ≈ ${Math.round(pmaxBar)} bar : la combustion instantanée du cycle idéal surestime la pression de pointe. Les moteurs de série plafonnent vers 120 à 200 bar.` });

  return {
    gamma: g, cv, cp, gammaIterations: iters,
    Vd: r.Vd, Vc: r.Vc, Vtot: r.Vd * inp.nCyl,
    mAir: m, mFuel: r.mFuel, mFuelBurnt: r.mBurnt,
    Qfuel: r.Qfuel, Qadd, Qout, Qloss: r.Qfuel - Qadd,
    Wnet, etaTh: Qadd > 0 ? Wnet / Qadd : 0, etaFuel: r.Qfuel > 0 ? Wnet / r.Qfuel : 0,
    etaOttoRef: 1 - Math.pow(inp.eps, 1 - g),
    pmiBar: Wnet / r.Vd / 1e5,
    powerW, powerKW: powerW / 1000, powerCh: powerW / 735.49875, torqueNm: powerW / omega,
    isfc: Wnet > 0 ? r.mFuel / Wnet * 3.6e9 : NaN,
    airKgH: m * inp.nCyl * inp.rpm / 120 * 3600, fuelKgH: r.mFuel * inp.nCyl * inp.rpm / 120 * 3600,
    rc: r.V4 / r.V3, alphaP: r.P3 / r.P2, xv: r.xv, pmaxBar, tmaxK, capped: r.capped,
    states, processes, path, warnings,
  };
}

function resultIsFinite(res: EngineResult): boolean {
  const nums = [res.Wnet, res.pmiBar, res.powerKW, res.etaTh, res.gamma, ...res.states.flatMap(s => [s.P, s.T, s.V, s.s])];
  return nums.every(Number.isFinite);
}

/* ---- Cinématique bielle-manivelle (θ = 0 : PMH début d'admission, 720° par cycle) ---- */
interface Kin { r: number; L: number; A: number; Vc: number; }
function makeKin(inp: EngineInputs, res: EngineResult): Kin {
  const B = inp.boreMm / 1000;
  return { r: inp.strokeMm / 2000, L: inp.rodMm / 1000, A: Math.PI / 4 * B * B, Vc: res.Vc };
}
/* distance axe vilebrequin → axe de piston (m) */
function pinHeight(k: Kin, thDeg: number): number {
  const t = thDeg * Math.PI / 180, s = Math.sin(t);
  return k.r * Math.cos(t) + Math.sqrt(k.L * k.L - k.r * k.r * s * s);
}
function volumeAt(k: Kin, thDeg: number): number { return k.Vc + k.A * (k.L + k.r - pinHeight(k, thDeg)); }
/* vitesse du piston (m/s), positive vers le PMH */
function pistonVelocity(k: Kin, thDeg: number, rpm: number): number {
  const t = thDeg * Math.PI / 180, w = 2 * Math.PI * rpm / 60, s = Math.sin(t), c = Math.cos(t);
  return -k.r * w * s - k.r * k.r * w * s * c / Math.sqrt(k.L * k.L - k.r * k.r * s * s);
}
/* Calage de distribution indicatif : AOA 10°, RFA 40°, AOE 40°, RFE 10° */
const TIMING = { ivo: 710, inDur: 230, evo: 500, exDur: 230, aoa: 10, rfa: 40, aoe: 40, rfe: 10 };
function liftFrac(thDeg: number, open: number, dur: number): number {
  const rel = ((thDeg - open) % 720 + 720) % 720;
  return rel >= dur ? 0 : Math.pow(Math.sin(Math.PI * rel / dur), 2);
}
const STROKES = ['Admission', 'Compression', 'Combustion – détente', 'Échappement'];
type GasKind = 'frais' | 'comprime' | 'brule' | 'echappement';
/* État du gaz dans le cylindre à l'angle θ, suivant le cycle théorique calculé */
function cycleAt(res: EngineResult, k: Kin, thDeg: number): { th: number; V: number; P: number; T: number; stroke: number; gas: GasKind } {
  const th = ((thDeg % 720) + 720) % 720;
  const V = volumeAt(k, th), g = res.gamma;
  const s1 = res.states[0], s3 = res.states[2], s4 = res.states[3];
  const stroke = Math.min(3, Math.floor(th / 180));
  if (stroke === 0) return { th, V, P: s1.P, T: s1.T, stroke, gas: 'frais' };
  if (stroke === 1) return { th, V, P: s1.P * Math.pow(s1.V / V, g), T: s1.T * Math.pow(s1.V / V, g - 1), stroke, gas: 'comprime' };
  if (stroke === 2) {
    if (V <= s4.V) return { th, V, P: s3.P, T: s3.T * V / s3.V, stroke, gas: 'brule' };
    return { th, V, P: s4.P * Math.pow(s4.V / V, g), T: s4.T * Math.pow(s4.V / V, g - 1), stroke, gas: 'brule' };
  }
  return { th, V, P: s1.P, T: NaN, stroke, gas: 'echappement' };
}

const fmtTick = (x: number): string => {
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a >= 100) return x.toLocaleString('fr-FR', { maximumFractionDigits: 0 });
  if (a >= 1) return x.toLocaleString('fr-FR', { maximumFractionDigits: 1 });
  return x.toLocaleString('fr-FR', { maximumFractionDigits: 3 });
};
const num = (s: string): number => {
  const t = (s ?? '').trim().replace(/\s/g, '').replace(',', '.');
  if (t === '' || !/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(t)) return NaN;

};

/* ---------- Architecture : disposition des cylindres et ordre d'allumage ---------- */
function layoutLabel(layout: Layout, n: number, angle: number, hotV?: boolean): string {
  if (layout === 'I') return `${n} cyl. en ligne`;
  if (layout === 'V') return `V${n} ${fmtTick(angle)}°${hotV ? ' hot-V' : ''}`;
  if (layout === 'VR') return `VR${n} ${fmtTick(angle)}°`;
  if (layout === 'W') return `W${n} ${fmtTick(angle)}°`;
  return `Flat-${n} (boxer)`;
}
function layoutBadge(layout: Layout, n: number): string {
  return layout === 'I' ? `L${n}` : layout === 'B' ? `H${n}` : `${layout}${n}`;
}
function defaultFiring(layout: Layout, n: number): number[] {
  const T: Record<string, number[]> = {
    'I1': [1], 'I2': [1, 2], 'I3': [1, 2, 3], 'I4': [1, 3, 4, 2], 'I5': [1, 2, 4, 5, 3], 'I6': [1, 5, 3, 6, 2, 4],
    'I8': [1, 6, 2, 5, 8, 3, 7, 4],
    'V2': [1, 2], 'V4': [1, 3, 2, 4], 'V6': [1, 4, 3, 6, 2, 5], 'V8': [1, 5, 4, 8, 6, 3, 7, 2], 'V10': [1, 6, 5, 10, 2, 7, 3, 8, 4, 9],
    'V12': [1, 7, 5, 11, 3, 9, 6, 12, 2, 8, 4, 10],
    'VR5': [1, 2, 4, 5, 3], 'VR6': [1, 5, 3, 6, 2, 4],
    'W12': [1, 12, 5, 8, 3, 10, 6, 7, 2, 11, 4, 9],
    'B2': [1, 2], 'B4': [1, 4, 3, 2], 'B6': [1, 6, 2, 4, 3, 5],
  };
  const f = T[layout + n];
  if (f) return f.slice();
  const out: number[] = [];
  if (layout === 'V' || layout === 'W' || layout === 'B') { const m = n / 2; for (let k = 0; k < m; k++) out.push(k + 1, m + k + 1); return out; }
  for (let k = 1; k <= n; k++) out.push(k);
  return out;
}
function layoutCheck(layout: Layout, n: number): string | null {
  if (layout === 'I' && n > 8) return 'Un moteur en ligne compte au plus 8 cylindres.';
  if ((layout === 'V' || layout === 'B') && n % 2) return `Un moteur ${layout === 'V' ? 'en V' : 'à plat'} demande un nombre pair de cylindres.`;
  if (layout === 'B' && n > 12) return 'Un moteur à plat compte au plus 12 cylindres.';
  if (layout === 'VR' && (n < 3 || n > 8)) return 'Un VR compte de 3 à 8 cylindres.';
  if (layout === 'W' && (n % 4 || n < 8)) return 'Un W compte 8, 12 ou 16 cylindres (multiple de 4).';
  return null;
}
function parseFiring(raw: string, n: number): number[] | string {
  const parts = (raw || '').split(/[^0-9]+/).filter(Boolean).map(Number);
  if (parts.length !== n) return `Indiquez les ${n} cylindres, séparés par des tirets.`;
  const seen = new Set(parts);
  if (seen.size !== n || parts.some(p => p < 1 || p > n)) return `Chaque cylindre de 1 à ${n} doit figurer une seule fois.`;
  return parts;
}
/* Décalage angulaire (°V) du PMH-admission de chaque cylindre, allumage équiréparti */
function cylinderPhases(firing: number[]): number[] {
  const n = firing.length, ph = new Array(n).fill(0);
  firing.forEach((c, pos) => { ph[c - 1] = pos * 720 / n; });
  return ph;
}

/* Facteur Pe / Pi(cycle théorique) supposé pour caler P1 sur la puissance constructeur */
const QUALITY = { essence: 0.62, diesel: 0.66 };
function specBaseInputs(sp: EngineSpec): EngineInputs {
  const boosted = !/atmosph/i.test(sp.ind);
  return {
    fuel: sp.fuel, cycle: 'sabathe', gammaMode: 'auto',
    boreMm: sp.bore, strokeMm: sp.stroke, rodMm: sp.rod ?? +(sp.stroke * 1.62).toFixed(1), nCyl: sp.n, eps: sp.eps,
    p1Bar: 1, t1C: boosted ? 45 : 35, rpm: sp.rpm, lambda: sp.fuel === 'diesel' ? 1.4 : 1.0,
    pciMJ: sp.fuel === 'diesel' ? 42.6 : 42.7, afrSt: sp.fuel === 'diesel' ? 14.5 : 14.7, etaCombPct: sp.fuel === 'diesel' ? 98 : 97,
    xvPct: sp.fuel === 'diesel' ? 35 : 80, gamma: 1.33,
    layout: sp.layout, angle: sp.angle, firing: sp.firing ? sp.firing.slice() : defaultFiring(sp.layout, sp.n), hotV: !!sp.hotV,
    numbering: sp.numbering || 'std', ohv: !!sp.ohv,
  };
}
function calibrateP1(sp: EngineSpec): number {
  const base = specBaseInputs(sp);
  const r = computeEngine(base);
  const target = sp.ps * 735.49875 / QUALITY[sp.fuel];
  const p1 = r.powerW > 0 ? target / r.powerW : 1;
  return Math.min(4.5, Math.max(0.6, Math.round(p1 * 100) / 100));
}

const ANGLE_RANGE: Record<Layout, [number, number] | null> = { I: null, B: null, V: [15, 180], VR: [5, 20], W: [40, 120] };
const ANGLE_DEFAULT: Record<Layout, number> = { I: 0, B: 180, V: 90, VR: 15, W: 72 };
const LAYOUT_NAME: Record<Layout, string> = { I: 'En ligne', V: 'En V', VR: 'VR (V étroit)', W: 'En W', B: 'À plat (boxer)' };

interface FormState {
  fuel: FuelKind; cycle: CycleKind; gammaMode: GammaMode; richMode: 'lambda' | 'phi';
  layout: Layout; hotV: boolean; firing: string; specId: string | null; modified: boolean; numbering: Numbering; ohv: boolean;
  raw: Record<FieldKey, string>;
}
const frNum = (x: number, d = 2) => x.toLocaleString('fr-FR', { maximumFractionDigits: d, useGrouping: false });
function specToForm(sp: EngineSpec): FormState {
  const b = specBaseInputs(sp), p1 = calibrateP1(sp);
  return {
    fuel: sp.fuel, cycle: 'sabathe', gammaMode: 'auto', richMode: 'lambda',
    layout: sp.layout, hotV: !!sp.hotV, firing: b.firing.join('-'), specId: sp.id, modified: false, numbering: sp.numbering || 'std', ohv: !!sp.ohv,
    raw: {
      boreMm: frNum(b.boreMm), strokeMm: frNum(b.strokeMm), rodMm: frNum(b.rodMm, 1), nCyl: String(sp.n), eps: frNum(sp.eps),
      angle: frNum(sp.layout === 'I' || sp.layout === 'B' ? ANGLE_DEFAULT[sp.layout] : sp.angle, 1), p1Bar: frNum(p1), t1C: String(b.t1C),
      rpm: String(sp.rpm), rich: frNum(b.lambda), pciMJ: frNum(b.pciMJ, 1), afrSt: frNum(b.afrSt, 1), etaCombPct: String(b.etaCombPct),
      xvPct: String(b.xvPct), gamma: '1,33',
    },
  };
}
const DEFAULT_SPEC = 'audi-40tfsi';
const FUEL_DEFAULTS: Record<FuelKind, { pci: string; afr: string }> = { essence: { pci: '42,7', afr: '14,7' }, diesel: { pci: '42,6', afr: '14,5' } };

function validate(form: FormState): { inputs: EngineInputs | null; errors: Record<string, string> } {
  const errors: Record<string, string> = {};
  const vals: Partial<Record<FieldKey, number>> = {};
  const range = ANGLE_RANGE[form.layout];
  (Object.keys(FIELDS) as FieldKey[]).forEach(k => {
    if (k === 'xvPct' && form.cycle !== 'sabathe') return;
    if (k === 'gamma' && form.gammaMode !== 'manuel') return;
    if (k === 'angle' && !range) return;
    let def = k === 'rich' && form.richMode === 'phi' ? { ...FIELDS.rich, min: 0.125, max: 1.667 } : FIELDS[k];
    if (k === 'angle' && range) def = { ...def, min: range[0], max: range[1] };
    const v = num(form.raw[k]);
    if (!Number.isFinite(v)) { errors[k] = 'Saisissez un nombre (virgule ou point).'; return; }
    if (def.int && !Number.isInteger(v)) { errors[k] = 'Valeur entière attendue.'; return; }
    if (v < def.min || v > def.max) { errors[k] = `Plage admise : ${fmtTick(def.min)} à ${fmtTick(def.max)} ${def.unit === '—' ? '' : def.unit}`.trim(); return; }
    vals[k] = v;
  });
  if (vals.rodMm !== undefined && vals.strokeMm !== undefined && vals.rodMm < 1.5 * vals.strokeMm / 2)
    errors.rodMm = `La bielle doit mesurer au moins 1,5 × S/2 (${fmtTick(0.75 * vals.strokeMm)} mm).`;
  let firing: number[] = [];
  if (vals.nCyl !== undefined) {
    const lc = layoutCheck(form.layout, vals.nCyl);
    if (lc) errors.nCyl = lc;
    else {
      const f = parseFiring(form.firing, vals.nCyl);
      if (typeof f === 'string') errors.firing = f; else firing = f;
    }
  }
  if (Object.keys(errors).length) return { inputs: null, errors };
  const lambda = form.richMode === 'phi' ? 1 / (vals.rich as number) : (vals.rich as number);
  return {
    errors, inputs: {
      fuel: form.fuel, cycle: form.cycle, gammaMode: form.gammaMode,
      boreMm: vals.boreMm!, strokeMm: vals.strokeMm!, rodMm: vals.rodMm!, nCyl: vals.nCyl!, eps: vals.eps!,
      p1Bar: vals.p1Bar!, t1C: vals.t1C!, rpm: vals.rpm!, lambda,
      pciMJ: vals.pciMJ!, afrSt: vals.afrSt!, etaCombPct: vals.etaCombPct!,
      xvPct: vals.xvPct ?? (form.cycle === 'otto' ? 100 : 0), gamma: vals.gamma ?? 1.35,
      layout: form.layout, angle: range ? vals.angle! : ANGLE_DEFAULT[form.layout], firing, hotV: form.layout === 'V' && form.hotV,
      numbering: form.layout === 'V' || form.layout === 'B' ? form.numbering : 'std', ohv: form.ohv && (form.layout === 'I' || form.layout === 'V'),
    },
  };
}

/* ---------- outils de tracé ---------- */
function niceTicks(min: number, max: number, count = 6): number[] {
  const span = max - min;
  if (!(span > 0)) return [min];
  const raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
  const out: number[] = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) out.push(Math.round(v / step) * step);
  return out;
}
function logTicks(min: number, max: number): number[] {
  const out: number[] = [];
  for (let d = Math.floor(Math.log10(min)); d <= Math.ceil(Math.log10(max)); d++)
    for (const m of [1, 2, 5]) { const v = m * Math.pow(10, d); if (v >= min && v <= max) out.push(v); }
  return out;
}
const lin = (d0: number, d1: number, r0: number, r1: number) => (v: number) => r0 + (v - d0) * (r1 - r0) / ((d1 - d0) || 1);
const logs = (d0: number, d1: number, r0: number, r1: number) => {
  const l0 = Math.log10(d0), l1 = Math.log10(d1);
  return (v: number) => r0 + (Math.log10(Math.max(v, 1e-12)) - l0) * (r1 - r0) / ((l1 - l0) || 1);
};
const SEG_COLOR = ['var(--work)', 'var(--heat)', 'var(--heat)', 'var(--work)', 'var(--cool)'];
const SEG_NAME = ['1→2 compression isentropique', '2→3 apport isochore', '3→4 apport isobare', '4→5 détente isentropique', '5→1 rejet isochore'];

function Axes({ W, H, M, xt, yt, X, Y, xLabel, yLabel }:
  { W: number; H: number; M: { l: number; r: number; t: number; b: number }; xt: number[]; yt: number[]; X: (v: number) => number; Y: (v: number) => number; xLabel: string; yLabel: string }) {
  return (
    <g>
      {yt.map(v => <g key={'y' + v}>
        <line x1={M.l} x2={W - M.r} y1={Y(v)} y2={Y(v)} style={{ stroke: 'var(--grid)' }} strokeWidth={1} />
        <text x={M.l - 8} y={Y(v) + 4} textAnchor="end" fontSize={11} style={{ fill: 'var(--muted)' }}>{fmtTick(v)}</text>
      </g>)}
      {xt.map(v => <g key={'x' + v}>
        <line x1={X(v)} x2={X(v)} y1={M.t} y2={H - M.b} style={{ stroke: 'var(--grid)' }} strokeWidth={1} />
        <text x={X(v)} y={H - M.b + 17} textAnchor="middle" fontSize={11} style={{ fill: 'var(--muted)' }}>{fmtTick(v)}</text>
      </g>)}
      <line x1={M.l} x2={W - M.r} y1={H - M.b} y2={H - M.b} style={{ stroke: 'var(--muted)' }} strokeWidth={1} />
      <line x1={M.l} x2={M.l} y1={M.t} y2={H - M.b} style={{ stroke: 'var(--muted)' }} strokeWidth={1} />
      <text x={(M.l + W - M.r) / 2} y={H - 8} textAnchor="middle" fontSize={11.5} style={{ fill: 'var(--ink)' }}>{xLabel}</text>
      <text transform={`translate(14 ${(M.t + H - M.b) / 2}) rotate(-90)`} textAnchor="middle" fontSize={11.5} style={{ fill: 'var(--ink)' }}>{yLabel}</text>
    </g>
  );
}

/* Regroupe les états confondus (Otto : 3≡4 ; Diesel : 2≡3) pour l'étiquetage */
function stateMarkers(res: EngineResult, getX: (s: StateRow) => number, getY: (s: StateRow) => number) {
  const groups: { ids: string[]; x: number; y: number }[] = [];
  res.states.forEach(s => {
    const x = getX(s), y = getY(s);
    const g = groups.find(gr => Math.hypot(gr.x - x, gr.y - y) < 3);
    if (g) g.ids.push(s.id); else groups.push({ ids: [s.id], x, y });
  });
  return groups;
}

function useHover(svgRef: any, W: number, H: number, pts: { x: number; y: number }[]) {
  const [idx, setIdx] = useState<number | null>(null);
  const onMove = (e: any) => {
    const el = svgRef.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * W, py = (e.clientY - r.top) / r.height * H;
    let best = -1, bd = Infinity;
    pts.forEach((p, i) => { const d = (p.x - px) ** 2 + (p.y - py) ** 2; if (d < bd) { bd = d; best = i; } });
    setIdx(bd < 45 * 45 ? best : null);
  };
  return { idx, onMove, onLeave: () => setIdx(null) };
}

function Tooltip({ x, y, W, lines }: { x: number; y: number; W: number; lines: string[] }) {
  const w = 172, h = 14 + lines.length * 15;
  const tx = x + 12 + w > W - 8 ? x - 12 - w : x + 12;
  const ty = Math.max(8, y - h - 8);
  return (
    <g pointerEvents="none">
      <rect x={tx} y={ty} width={w} height={h} rx={3} style={{ fill: 'var(--panel)', stroke: 'var(--line)' }} />
      {lines.map((l, i) => <text key={i} x={tx + 9} y={ty + 18 + i * 15} fontSize={11} style={{ fill: i === 0 ? 'var(--muted)' : 'var(--ink)' }}>{l}</text>)}
    </g>
  );
}

function Legend({ items }: { items: { color: string; label: string; dash?: boolean; area?: boolean }[] }) {
  return (
    <div className="flex flex-wrap gap-x-4 gap-y-1.5 text-[12px] text-muted">
      {items.map(it => (
        <span key={it.label} className="inline-flex items-center gap-1.5">
          <svg width="22" height="10" aria-hidden="true">
            {it.area ? <rect x="1" y="1" width="20" height="8" style={{ fill: it.color, opacity: 0.16, stroke: it.color }} strokeWidth={0.8} />
              : <line x1="1" x2="21" y1="5" y2="5" style={{ stroke: it.color }} strokeWidth={2.4} strokeDasharray={it.dash ? '3 3' : undefined} />}
          </svg>{it.label}
        </span>
      ))}
    </div>
  );
}

/* ---------- Diagramme P-V ---------- */
function PVChart({ res, inp }: { res: EngineResult; inp: EngineInputs }) {
  const [log, setLog] = useState<'lin' | 'log'>('lin');
  const svgRef = useRef(null);
  const markRef = useRef<any>(null);
  const scaleRef = useRef<any>(null);
  const W = 640, H = 390, M = { l: 58, r: 22, t: 18, b: 46 };
  const V1 = res.states[0].V * 1e6, V2 = res.states[1].V * 1e6;
  const Ps = res.path.map(p => p.P);
  const Pmax = Math.max(...Ps), Pmin = Math.min(...Ps);
  let X: (v: number) => number, Y: (v: number) => number, xt: number[], yt: number[];
  if (log === 'log') {
    const x0 = V2 * 0.8, x1 = V1 * 1.25, y0 = Pmin * 0.6, y1 = Pmax * 1.5;
    X = logs(x0, x1, M.l, W - M.r); Y = logs(y0, y1, H - M.b, M.t); xt = logTicks(x0, x1); yt = logTicks(y0, y1);
  } else {
    const x1 = V1 * 1.06, y1 = Pmax * 1.1;
    X = lin(0, x1, M.l, W - M.r); Y = lin(0, y1, H - M.b, M.t); xt = niceTicks(0, x1, 6); yt = niceTicks(0, y1, 6);
  }
  const pts = res.path.map(p => ({ x: X(p.V), y: Y(p.P) }));
  const { idx, onMove, onLeave } = useHover(svgRef, W, H, pts);
  const segs = [0, 1, 2, 3, 4].map(k => res.path.map((p, i) => ({ p, i })).filter(o => o.p.seg === k).map(o => `${pts[o.i].x.toFixed(1)},${pts[o.i].y.toFixed(1)}`).join(' '));
  const area = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const groups = stateMarkers(res, s => X(s.V * 1e6), s => Y(s.P / 1e5));
  const hp = idx !== null ? res.path[idx] : null;
  scaleRef.current = { X, Y };
  useEffect(() => {
    const k = makeKin(inp, res);
    const upd = (a: number) => {
      const el = markRef.current, sc = scaleRef.current; if (!el || !sc) return;
      const c = cycleAt(res, k, a);
      el.setAttribute('transform', `translate(${sc.X(c.V * 1e6).toFixed(1)} ${sc.Y(c.P / 1e5).toFixed(1)})`);
    };
    upd(crankBus.local());
    return crankBus.sub(upd);
  }, [res, inp, log]);
  const P1b = res.states[0].P / 1e5;

  return (
    <div className="card p-4 flex flex-col gap-3 min-w-0">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 className="disp text-[22px] font-semibold leading-tight">Diagramme P-V</h2>
          <p className="text-[12.5px] text-muted">Pression dans un cylindre en fonction du volume total. Aire enclose = W<sub>net</sub>.</p>
        </div>
        <div className="w-[150px]"><Seg label="Échelle" value={log} onChange={setLog} options={[{ value: 'lin', label: 'Linéaire' }, { value: 'log', label: 'Log-log' }]} /></div>
      </div>
      <div className="scroll-x">
        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} width="100%" style={{ minWidth: 420, display: 'block', touchAction: 'pan-y' }}
          onPointerMove={onMove} onPointerLeave={onLeave} role="img" aria-label="Diagramme pression-volume du cycle">
          <Axes W={W} H={H} M={M} xt={xt} yt={yt} X={X} Y={Y} xLabel="V — volume du cylindre (cm³)  [extensive]" yLabel="P — pression (bar)  [intensive]" />
          {[{ v: V2, t: 'PMH' }, { v: V1, t: 'PMB' }].map(o => (
            <g key={o.t}>
              <line x1={X(o.v)} x2={X(o.v)} y1={M.t} y2={H - M.b} style={{ stroke: 'var(--muted)' }} strokeDasharray="2 4" strokeWidth={1} />
              <text x={X(o.v) + 4} y={M.t + 11} fontSize={10.5} style={{ fill: 'var(--muted)' }}>{o.t}</text>
            </g>
          ))}
          <polygon points={area} style={{ fill: 'var(--work)', opacity: 0.1 }} />
          <line x1={X(V2)} x2={X(V1)} y1={Y(P1b)} y2={Y(P1b)} style={{ stroke: 'var(--muted)' }} strokeDasharray="5 4" strokeWidth={1.4} />
          {segs.map((s, k) => <polyline key={k} points={s} fill="none" style={{ stroke: SEG_COLOR[k] }} strokeWidth={2.4} strokeLinejoin="round" strokeLinecap="round" />)}
          {groups.map(g => (
            <g key={g.ids.join()}>
              <circle cx={g.x} cy={g.y} r={4.2} style={{ fill: 'var(--panel)', stroke: 'var(--ink)' }} strokeWidth={1.6} />
              <text x={g.x + (g.ids.includes('2') || g.ids.includes('3') && !g.ids.includes('4') ? -9 : 9)} y={g.y - 8}
                textAnchor={g.ids.includes('2') || g.ids.includes('3') && !g.ids.includes('4') ? 'end' : 'start'}
                fontSize={12} fontWeight={600} style={{ fill: 'var(--ink)' }}>{g.ids.join('≡')}</text>
            </g>
          ))}
          <g ref={markRef} pointerEvents="none">
            <circle r={9} style={{ fill: 'var(--ink)', opacity: 0.15 }} />
            <circle r={5} style={{ fill: 'var(--ink)', stroke: 'var(--panel)' }} strokeWidth={1.6} />
          </g>
          {hp && idx !== null && <g pointerEvents="none">
            <line x1={pts[idx].x} x2={pts[idx].x} y1={M.t} y2={H - M.b} style={{ stroke: 'var(--ink)', opacity: 0.35 }} strokeWidth={1} />
            <line x1={M.l} x2={W - M.r} y1={pts[idx].y} y2={pts[idx].y} style={{ stroke: 'var(--ink)', opacity: 0.35 }} strokeWidth={1} />
            <circle cx={pts[idx].x} cy={pts[idx].y} r={4} style={{ fill: SEG_COLOR[hp.seg] }} />
            <Tooltip x={pts[idx].x} y={pts[idx].y} W={W} lines={[SEG_NAME[hp.seg], `V = ${fmt(hp.V, 1)} cm³`, `P = ${fmt(hp.P, 2)} bar`, `T = ${fmt(hp.T, 0)} K`]} />
          </g>}
        </svg>
      </div>
      <Legend items={[{ color: 'var(--work)', label: 'Isentropique P·V^γ = cte' }, { color: 'var(--heat)', label: 'Apport de chaleur' }, { color: 'var(--cool)', label: 'Rejet de chaleur' }, { color: 'var(--muted)', label: 'Transvasement idéal (P₁)', dash: true }, { color: 'var(--work)', label: 'Travail net', area: true }]} />
      <p className="text-[12px] text-muted -mt-1">Le point noir suit le cylindre sélectionné dans l'animation 3D.</p>
    </div>
  );
}

/* ---------- Diagramme T-s ---------- */
function TsChart({ res }: { res: EngineResult }) {
  const svgRef = useRef(null);
  const W = 640, H = 390, M = { l: 58, r: 22, t: 18, b: 46 };
  const ss = res.path.map(p => p.s), Ts = res.path.map(p => p.T);
  const smin = Math.min(...ss), smax = Math.max(...ss), pad = (smax - smin) * 0.08 || 50;
  const tmax = Math.max(...Ts);
  const x0 = smin - pad, x1 = smax + pad, y0 = 0, y1 = tmax * 1.08;
  const X = lin(x0, x1, M.l, W - M.r), Y = lin(y0, y1, H - M.b, M.t);
  const xt = niceTicks(x0, x1, 6), yt = niceTicks(y0, y1, 6);
  const pts = res.path.map(p => ({ x: X(p.s), y: Y(p.T) }));
  const { idx, onMove, onLeave } = useHover(svgRef, W, H, pts);
  const segs = [0, 1, 2, 3, 4].map(k => res.path.map((p, i) => ({ p, i })).filter(o => o.p.seg === k).map(o => `${pts[o.i].x.toFixed(1)},${pts[o.i].y.toFixed(1)}`).join(' '));
  // aires : chaleur apportée sous 2→3→4, chaleur rejetée sous 5→1
  const base = Y(0);
  const under = (k: number[]) => {
    const p = res.path.map((q, i) => ({ q, i })).filter(o => k.includes(o.q.seg)).map(o => pts[o.i]);
    if (!p.length) return '';
    return [`${p[0].x.toFixed(1)},${base.toFixed(1)}`, ...p.map(q => `${q.x.toFixed(1)},${q.y.toFixed(1)}`), `${p[p.length - 1].x.toFixed(1)},${base.toFixed(1)}`].join(' ');
  };
  const groups = stateMarkers(res, s => X(s.s), s => Y(s.T));
  const hp = idx !== null ? res.path[idx] : null;
  return (
    <div className="flex flex-col gap-3 min-w-0">
      <p className="text-[12.5px] text-muted">Entropie massique s (réf. 25 °C, 1 atm). Aire sous 2→4 = q<sub>in</sub>, sous 5→1 = q<sub>out</sub> (par kg).</p>
      <div className="scroll-x">
        <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} width="100%" style={{ minWidth: 420, display: 'block', touchAction: 'pan-y' }}
          onPointerMove={onMove} onPointerLeave={onLeave} role="img" aria-label="Diagramme température-entropie du cycle">
          <Axes W={W} H={H} M={M} xt={xt} yt={yt} X={X} Y={Y} xLabel="s — entropie massique (J/kg·K)  [intensive]" yLabel="T — température (K)  [intensive]" />
          <polygon points={under([1, 2])} style={{ fill: 'var(--heat)', opacity: 0.12 }} />
          <polygon points={under([4])} style={{ fill: 'var(--cool)', opacity: 0.16 }} />
          {segs.map((s, k) => <polyline key={k} points={s} fill="none" style={{ stroke: SEG_COLOR[k] }} strokeWidth={2.4} strokeLinejoin="round" strokeLinecap="round" />)}
          {groups.map(g => {
            const left = g.ids.includes('1') || g.ids.includes('2');
            return (
              <g key={g.ids.join()}>
                <circle cx={g.x} cy={g.y} r={4.2} style={{ fill: 'var(--panel)', stroke: 'var(--ink)' }} strokeWidth={1.6} />
                <text x={g.x + (left ? -9 : 9)} y={g.y + (g.ids.includes('1') ? 14 : -8)} textAnchor={left ? 'end' : 'start'} fontSize={12} fontWeight={600} style={{ fill: 'var(--ink)' }}>{g.ids.join('≡')}</text>
              </g>
            );
          })}
          {hp && idx !== null && <g pointerEvents="none">
            <circle cx={pts[idx].x} cy={pts[idx].y} r={4} style={{ fill: SEG_COLOR[hp.seg] }} />
            <Tooltip x={pts[idx].x} y={pts[idx].y} W={W} lines={[SEG_NAME[hp.seg], `s = ${fmt(hp.s, 1)} J/kg·K`, `T = ${fmt(hp.T, 0)} K`, `P = ${fmt(hp.P, 2)} bar`]} />
          </g>}
        </svg>
      </div>
      <Legend items={[{ color: 'var(--work)', label: 'Isentropique (s = cte)' }, { color: 'var(--heat)', label: 'q apportée', area: true }, { color: 'var(--cool)', label: 'q rejetée', area: true }]} />
    </div>
  );
}

/* ---------- Synoptique énergétique ---------- */
function EnergyFlow({ res }: { res: EngineResult }) {
  const W = 640, H = 330, top = 24, gap = 18, scaleH = 240;
  const k = scaleH / Math.max(res.Qfuel, 1e-9);
  const hW = Math.max(res.Wnet, 0) * k, hO = Math.max(res.Qout, 0) * k, hL = Math.max(res.Qloss, 0) * k;
  const xs = 30, x1 = 250, xo = 470, nw = 14;
  const sY = top + gap; // source alignée
  const ribbon = (xa: number, a0: number, a1: number, xb: number, b0: number, b1: number) => {
    const c = (xa + xb) / 2;
    return `M${xa},${a0} C${c},${a0} ${c},${b0} ${xb},${b0} L${xb},${b1} C${c},${b1} ${c},${a1} ${xa},${a1} Z`;
  };
  const oW = top, oO = top + hW + gap, oL = top + hW + gap + hO + gap;
  const pct = (v: number) => `${fmt(v / res.Qfuel * 100, 1)} %`;
  const lab = (x: number, y: number, h: number, t: string, v: number, color: string) => (
    <g>
      <text x={x} y={y + h / 2 - 3} fontSize={12} fontWeight={600} style={{ fill: color }}>{t}</text>
      <text x={x} y={y + h / 2 + 12} fontSize={11} style={{ fill: 'var(--muted)' }}>{fmt(v, 0)} J · {pct(v)}</text>
    </g>
  );
  return (
    <div className="flex flex-col gap-3 min-w-0">
      <p className="text-[12.5px] text-muted">Flux d'énergie par cylindre et par cycle (extensif, J). Largeurs proportionnelles à l'énergie chimique du carburant introduit.</p>
      <div className="scroll-x">
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ minWidth: 460, display: 'block' }} role="img" aria-label="Synoptique des flux d'énergie">
          <path d={ribbon(xs + nw, sY, sY + hW + hO, x1, sY, sY + hW + hO)} style={{ fill: 'var(--heat)', opacity: 0.22 }} />
          <path d={ribbon(xs + nw, sY + hW + hO, sY + hW + hO + hL, xo, oL, oL + hL)} style={{ fill: 'var(--loss)', opacity: 0.3 }} />
          <path d={ribbon(x1 + nw, sY, sY + hW, xo, oW, oW + hW)} style={{ fill: 'var(--work)', opacity: 0.28 }} />
          <path d={ribbon(x1 + nw, sY + hW, sY + hW + hO, xo, oO, oO + hO)} style={{ fill: 'var(--cool)', opacity: 0.26 }} />
          <rect x={xs} y={sY} width={nw} height={hW + hO + hL} style={{ fill: 'var(--ink)' }} />
          <rect x={x1} y={sY} width={nw} height={hW + hO} style={{ fill: 'var(--heat)' }} />
          <rect x={xo} y={oW} width={nw} height={Math.max(hW, 1)} style={{ fill: 'var(--work)' }} />
          <rect x={xo} y={oO} width={nw} height={Math.max(hO, 1)} style={{ fill: 'var(--cool)' }} />
          <rect x={xo} y={oL} width={nw} height={Math.max(hL, 1)} style={{ fill: 'var(--loss)' }} />
          <text x={xs} y={sY - 8} fontSize={12} fontWeight={600} style={{ fill: 'var(--ink)' }}>m<tspan baselineShift="sub" fontSize={9}>f</tspan>·PCI = {fmt(res.Qfuel, 0)} J</text>
          <text x={x1} y={sY - 8} fontSize={12} fontWeight={600} style={{ fill: 'var(--heat)' }}>Q<tspan baselineShift="sub" fontSize={9}>in</tspan> = {fmt(res.Qadd, 0)} J</text>
          {lab(xo + nw + 8, oW, hW, 'W net (travail indiqué)', res.Wnet, 'var(--work)')}
          {lab(xo + nw + 8, oO, hO, 'Q out (échappement)', res.Qout, 'var(--cool)')}
          {lab(xo + nw + 8, oL, Math.max(hL, 12), 'Pertes combustion', res.Qloss, 'var(--muted)')}
        </svg>
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-[12.5px]">
        <Readout label="η thermique" value={fmt(res.etaTh * 100, 1)} unit="%" />
        <Readout label="η global carb." value={fmt(res.etaFuel * 100, 1)} unit="%" />
        <Readout label="Q_out / Q_in" value={fmt(res.Qout / res.Qadd * 100, 1)} unit="%" />
        <Readout label="Écart bilan" value={fmt(res.Qadd - res.Wnet - res.Qout, 3)} unit="J" />
      </div>
    </div>
  );
}

/* ---------- Tableaux ---------- */
function IntensiveTable({ res }: { res: EngineResult }) {
  return (
    <div className="scroll-x">
      <table className="tbl">
        <thead><tr>
          <th>État</th><th>P (bar)</th><th>T (K)</th><th>T (°C)</th><th>v (m³/kg)</th><th>u (kJ/kg)</th><th>h (kJ/kg)</th><th>s (J/kg·K)</th>
        </tr></thead>
        <tbody>
          {res.states.map(s => (
            <tr key={s.id}>
              <td className="txt"><span className="mono font-semibold mr-2">{s.id}</span><span className="text-muted">{s.label}</span></td>
              <td>{fmt(s.P / 1e5, 2)}</td><td>{fmt(s.T, 1)}</td><td>{fmt(s.T - 273.15, 1)}</td>
              <td>{fmt(s.v, 4)}</td><td>{fmt(s.u / 1000, 1)}</td><td>{fmt(s.h / 1000, 1)}</td><td>{fmt(s.s, 1)}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <p className="text-[12px] text-muted mt-3 max-w-[70ch]">Indépendantes de la taille du système : diviser le cylindre en deux ne les change pas. u = c<sub>v</sub>·T et h = c<sub>p</sub>·T (origine 0 K), s relative à 25 °C et 1 atm.</p>
    </div>
  );
}

function ExtensiveTable({ res, nCyl, rpm }: { res: EngineResult; nCyl: number; rpm: number }) {
  const perS = nCyl * rpm / 120;
  const rows: [string, number, number, string][] = [
    ['Masse d\'air enfermée m', res.mAir * 1e3, res.mAir * 1e3 * nCyl, 'g'],
    ['Masse de carburant m_f', res.mFuel * 1e6, res.mFuel * 1e6 * nCyl, 'mg'],
    ['Énergie chimique m_f·PCI', res.Qfuel, res.Qfuel * nCyl, 'J'],
    ['Chaleur apportée Q_in', res.Qadd, res.Qadd * nCyl, 'J'],
    ['Chaleur rejetée Q_out', res.Qout, res.Qout * nCyl, 'J'],
    ['Travail net W_net', res.Wnet, res.Wnet * nCyl, 'J'],
  ];
  return (
    <div className="flex flex-col gap-5">
      <div className="scroll-x">
        <table className="tbl">
          <thead><tr><th>État</th><th>V (cm³)</th><th>m (g)</th><th>U (J)</th><th>H (J)</th><th>S (mJ/K)</th></tr></thead>
          <tbody>
            {res.states.map(s => (
              <tr key={s.id}>
                <td className="txt"><span className="mono font-semibold mr-2">{s.id}</span><span className="text-muted">{s.label}</span></td>
                <td>{fmt(s.V * 1e6, 2)}</td><td>{fmt(s.m * 1e3, 4)}</td><td>{fmt(s.U, 1)}</td><td>{fmt(s.H, 1)}</td><td>{fmt(s.S * 1e3, 1)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="scroll-x">
        <table className="tbl">
          <thead><tr><th>Bilan par cycle</th><th>1 cylindre</th><th>Moteur ({nCyl} cyl.)</th><th>Unité</th><th>Débit moteur</th></tr></thead>
          <tbody>
            {rows.map(([l, a, b, u]) => (
              <tr key={l}>
                <td className="txt">{l}</td><td>{fmt(a, u === 'J' ? 1 : 3)}</td><td>{fmt(b, u === 'J' ? 1 : 3)}</td><td className="txt text-muted">{u}</td>
                <td>{u === 'J' ? `${fmt(a * perS / 1000, 1)} kW`
                  : u === 'g' ? `${fmt(res.airKgH, 1)} kg/h` : `${fmt(res.fuelKgH, 2)} kg/h`}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-[12px] text-muted max-w-[70ch]">Proportionnelles à la quantité de matière : elles doublent si l'on double la masse enfermée. Débits = valeur moteur × N/120 (4 temps, un cycle tous les deux tours).</p>
    </div>
  );
}

function ProcessTable({ res }: { res: EngineResult }) {
  const tQ = res.processes.reduce((a, p) => a + p.Q, 0), tW = res.processes.reduce((a, p) => a + p.W, 0), tU = res.processes.reduce((a, p) => a + p.dU, 0);
  const dot = (k: 'w' | 'h' | 'c') => <span className="inline-block w-2.5 h-2.5 rounded-full mr-2 align-middle" style={{ background: k === 'w' ? 'var(--work)' : k === 'h' ? 'var(--heat)' : 'var(--cool)' }} />;
  return (
    <div className="scroll-x">
      <table className="tbl">
        <thead><tr><th>Transformation</th><th>Nature</th><th>Q (J)</th><th>W (J)</th><th>ΔU (J)</th><th>q (kJ/kg)</th><th>w (kJ/kg)</th></tr></thead>
        <tbody>
          {res.processes.map(p => (
            <tr key={p.id}>
              <td className="txt">{dot(p.kind)}<span className="mono font-semibold mr-2">{p.id}</span>{p.name}</td>
              <td className="txt text-muted text-right">{p.nature}</td>
              <td>{fmt(p.Q, 1)}</td><td>{fmt(p.W, 1)}</td><td>{fmt(p.dU, 1)}</td>
              <td>{fmt(p.Q / res.mAir / 1000, 1)}</td><td>{fmt(p.W / res.mAir / 1000, 1)}</td>
            </tr>
          ))}
          <tr className="tot">
            <td className="txt">Cycle complet</td><td className="txt text-muted text-right">fermé</td>
            <td>{fmt(tQ, 1)}</td><td>{fmt(tW, 1)}</td><td>{fmt(tU, 3)}</td>
            <td>{fmt(tQ / res.mAir / 1000, 1)}</td><td>{fmt(tW / res.mAir / 1000, 1)}</td>
          </tr>
        </tbody>
      </table>
      <p className="text-[12px] text-muted mt-3 max-w-[70ch]">Convention : W &gt; 0 fourni par le gaz au piston, Q &gt; 0 reçue par le gaz. Sur un cycle ΔU = 0, donc ∑Q = ∑W = W<sub>net</sub>. Q, W, ΔU sont extensives ; q et w sont leurs équivalents massiques (intensifs).</p>
    </div>
  );
}

/* ---------- Export ---------- */
function buildExport(res: EngineResult, inp: EngineInputs) {
  const r6 = (x: number) => Number.isFinite(x) ? +x.toPrecision(6) : null;
  const json = {
    outil: 'Banc Cycle MCI — cycle mixte Sabathé, air standard',
    entrees: { ...inp, phi: r6(1 / inp.lambda), architecture: layoutLabel(inp.layout, inp.nCyl, inp.angle, inp.hotV), ordre_allumage: inp.firing.join('-') },
    hypotheses: { R_J_kgK: R_AIR, gamma: r6(res.gamma), cv_J_kgK: r6(res.cv), cp_J_kgK: r6(res.cp), part_isochore: r6(res.xv), reference_entropie: '298,15 K ; 101 325 Pa', temps: 4 },
    geometrie: { cylindree_unitaire_cm3: r6(res.Vd * 1e6), volume_mort_cm3: r6(res.Vc * 1e6), cylindree_totale_cm3: r6(res.Vtot * 1e6) },
    etats_intensifs: res.states.map(s => ({ etat: s.id, P_bar: r6(s.P / 1e5), T_K: r6(s.T), v_m3_kg: r6(s.v), u_kJ_kg: r6(s.u / 1000), h_kJ_kg: r6(s.h / 1000), s_J_kgK: r6(s.s) })),
    etats_extensifs: res.states.map(s => ({ etat: s.id, V_cm3: r6(s.V * 1e6), m_g: r6(s.m * 1e3), U_J: r6(s.U), H_J: r6(s.H), S_J_K: r6(s.S) })),
    transformations: res.processes.map(p => ({ transformation: p.id, nature: p.nature, Q_J: r6(p.Q), W_J: r6(p.W), dU_J: r6(p.dU) })),
    bilan: {
      W_net_J_cycle_cyl: r6(res.Wnet), Q_in_J: r6(res.Qadd), Q_out_J: r6(res.Qout), Q_carburant_J: r6(res.Qfuel),
      rendement_thermique_pct: r6(res.etaTh * 100), rendement_global_carburant_pct: r6(res.etaFuel * 100),
      PMI_bar: r6(res.pmiBar), puissance_indiquee_kW: r6(res.powerKW), puissance_indiquee_ch: r6(res.powerCh),
      couple_indique_Nm: r6(res.torqueNm), CSI_g_kWh: r6(res.isfc), Pmax_bar: r6(res.pmaxBar), Tmax_K: r6(res.tmaxK),
      debit_air_kg_h: r6(res.airKgH), debit_carburant_kg_h: r6(res.fuelKgH),
    },
  };
  const c = (x: number, d = 4) => Number.isFinite(x) ? x.toFixed(d).replace('.', ',') : '';
  const L: string[] = [];
  L.push('# Grandeurs INTENSIVES par etat');
  L.push('Etat;P (bar);T (K);v (m3/kg);u (kJ/kg);h (kJ/kg);s (J/kg.K)');
  res.states.forEach(s => L.push([s.id, c(s.P / 1e5), c(s.T, 2), c(s.v, 6), c(s.u / 1000, 3), c(s.h / 1000, 3), c(s.s, 2)].join(';')));
  L.push('');
  L.push('# Grandeurs EXTENSIVES par etat (1 cylindre)');
  L.push('Etat;V (cm3);m (g);U (J);H (J);S (J/K)');
  res.states.forEach(s => L.push([s.id, c(s.V * 1e6, 3), c(s.m * 1e3, 5), c(s.U, 2), c(s.H, 2), c(s.S, 5)].join(';')));
  L.push('');
  L.push('# Transformations (1 cylindre, J/cycle)');
  L.push('Transformation;Nature;Q (J);W (J);dU (J)');
  res.processes.forEach(p => L.push([p.id.replace('→', '-'), p.nature, c(p.Q, 2), c(p.W, 2), c(p.dU, 2)].join(';')));
  L.push('');
  L.push('# Bilan');
  L.push('Grandeur;Valeur;Unite');
  ([
    ['W_net', res.Wnet, 'J/cycle/cyl'], ['Q_in', res.Qadd, 'J'], ['Q_out', res.Qout, 'J'], ['Rendement thermique', res.etaTh * 100, '%'],
    ['PMI', res.pmiBar, 'bar'], ['Puissance indiquee', res.powerKW, 'kW'], ['Puissance indiquee', res.powerCh, 'ch'],
    ['Couple indique', res.torqueNm, 'N.m'], ['CSI', res.isfc, 'g/kWh'], ['gamma', res.gamma, '-'],
  ] as [string, number, string][]).forEach(([a, b, u]) => L.push(`${a};${c(b, 4)};${u}`));
  return { json: JSON.stringify(json, null, 2), csv: L.join('\n') };
}

function ExportPanel({ res, inp }: { res: EngineResult; inp: EngineInputs }) {
  const [format, setFormat] = useState<'json' | 'csv'>('json');
  const [status, setStatus] = useState<'idle' | 'ok' | 'manual'>('idle');
  const [open, setOpen] = useState(false);
  const taRef = useRef(null);
  const data = useMemo(() => buildExport(res, inp), [res, inp]);
  const text = format === 'json' ? data.json : data.csv;
  const fallback = () => {
    setStatus('manual'); setOpen(true);
    setTimeout(() => { const ta: any = taRef.current; if (ta) { ta.focus(); ta.select(); } }, 30);
  };
  const copy = () => {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => { setStatus('ok'); setTimeout(() => setStatus('idle'), 2200); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  };
  return (
    <div className="card p-4 flex flex-col gap-3">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 className="disp text-[22px] font-semibold leading-tight">Export des résultats</h2>
          <p className="text-[12.5px] text-muted">{format === 'json' ? 'Entrées, hypothèses, états, transformations et bilan.' : 'CSV : séparateur « ; », décimales « , » (Excel FR).'}</p>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <div className="w-[130px]"><Seg label="Format d'export" value={format} onChange={v => { setFormat(v); setStatus('idle'); }} options={[{ value: 'json', label: 'JSON' }, { value: 'csv', label: 'CSV' }]} /></div>
          <button type="button" className="btn btn-primary" onClick={copy}>{status === 'ok' ? <IcCheck /> : <IcCopy />}{status === 'ok' ? 'Copié' : `Copier le ${format.toUpperCase()}`}</button>
        </div>
      </div>
      {status === 'manual' && <div className="note note-info"><IcInfo /><span>Le presse-papiers est bloqué ici. Le texte est sélectionné ci-dessous : copiez-le avec Ctrl+C (⌘+C).</span></div>}
      <details open={open} onToggle={(e: any) => setOpen(e.currentTarget.open)}>
        <summary className="cursor-pointer text-[13px] font-medium text-muted select-none">Aperçu du {format.toUpperCase()} ({text.split('\n').length} lignes)</summary>
        <textarea ref={taRef} id="export-text" className="out mt-2" readOnly value={text} aria-label="Contenu exporté" />
      </details>
    </div>
  );
}

/* Analyse d'architecture : équilibrage et implantation */
function architectureNotes(layout: Layout, n: number, angle: number): { d: string; pro: string[]; con: string[] } {
  if (layout === 'I') {
    if (n === 3) return { d: "Trois-cylindres en ligne, manetons à 120°, un allumage tous les 240° : les forces sont équilibrées mais un couple de basculement du premier ordre subsiste.", pro: ["Frottements et pertes thermiques réduits (moins de cylindres)", "Compact et léger"], con: ["Couple de basculement du premier ordre : vibrations au ralenti"] };
    if (n === 4) return { d: "Quatre-cylindres en ligne à manetons en un seul plan, un allumage tous les 180° : les forces d'inertie du second ordre s'additionnent et ne sont pas équilibrées.", pro: ["Simple, compact et économique à produire"], con: ["Vibrations du second ordre au-delà de 2 L environ, d'où des arbres d'équilibrage"] };
    if (n === 5) return { d: "Cinq-cylindres en ligne, un allumage tous les 144° : sonorité caractéristique et régularité de couple supérieure au quatre-cylindres.", pro: ["Couple régulier, sonorité unique"], con: ["Couples du premier et du second ordre résiduels", "Plus long qu'un quatre-cylindres"] };
    if (n === 6) return { d: "Six-cylindres en ligne : forces et couples des premier et second ordres s'annulent naturellement. C'est la référence de douceur sans arbre d'équilibrage.", pro: ["Équilibre naturel parfait", "Une seule culasse, collecteurs simples"], con: ["Moteur long : implantation difficile en transversal", "Vilebrequin long sensible aux vibrations de torsion (amortisseur nécessaire)"] };
    return { d: `${n} cylindres en ligne.`, pro: [], con: [] };
  }
  if (layout === 'B') return n === 6
    ? { d: "Six-cylindres à plat (boxer) : pistons opposés deux à deux, chacun sur son propre maneton. Équilibre parfait et centre de gravité très bas.", pro: ["Équilibre parfait", "Centre de gravité très bas"], con: ["Moteur large, deux culasses"] }
    : { d: "Quatre-cylindres à plat : les forces du premier ordre s'annulent entre pistons opposés ; un léger couple du second ordre subsiste.", pro: ["Centre de gravité bas", "Meilleur équilibre qu'un quatre-cylindres en ligne"], con: ["Largeur, deux culasses, collecteurs plus longs"] };
  if (layout === 'VR') return { d: `Deux rangées de cylindres décalées de ${fmtTick(angle)}° sous une seule culasse ; vilebrequin à manetons indépendants, allumage tous les ${fmtTick(720 / n)}°.`, pro: ["Encombrement réduit"], con: ["Rangées non symétriques vis-à-vis des conduits"] };
  if (layout === 'W') return { d: `Deux blocs VR à 15° calés à ${fmtTick(angle)}° : ${n} cylindres, un allumage tous les ${fmtTick(720 / n)}°.`, pro: ["Compacité exceptionnelle pour le nombre de cylindres"], con: ["Thermique et accessibilité très difficiles"] };
  /* décalage de manetons requis pour un allumage régulier : écart minimal entre l'angle du V et un multiple de l'intervalle */
  const iv = 720 / n;
  let off = 360;
  for (let k = 0; k <= n; k++) { const d = Math.abs((((angle - k * iv) % 360) + 540) % 360 - 180); off = Math.min(off, d); }
  const shared = off < 0.5;
  const crankTxt = shared ? 'les deux bielles d\'un même coude partagent un maneton' : `les manetons d'un même coude sont décalés de ${fmtTick(off)}° pour un allumage régulier`;
  if (n === 8) return { d: `V8 à ${fmtTick(angle)}°, un allumage tous les 90° ; ${crankTxt}.`, pro: ["Compact pour sa cylindrée, couple abondant"], con: ["Deux culasses et collecteurs complexes"] };
  if (n === 12) return { d: `V12 à ${fmtTick(angle)}°, un allumage tous les 60° ; ${crankTxt}.${angle === 180 ? ' Ce V à 180° ressemble à un boxer, dont il se distingue justement par ces manetons communs.' : ''}`, pro: ["Équilibre parfait (deux six-cylindres en ligne)", "Couple d'une régularité inégalée"], con: ["Long, lourd et coûteux"] };
  if (n === 10) return { d: `V10 à ${fmtTick(angle)}°, un allumage tous les 72° ; ${crankTxt}.`, pro: ["Allumage régulier et montée en régime vive"], con: ["Couple du premier ordre résiduel, souvent compensé par un arbre d'équilibrage"] };
  if (n === 6) return { d: `V6 à ${fmtTick(angle)}°, un allumage tous les 120° ; ${crankTxt}.${angle === 120 ? ' L\'angle de 120° abaisse le centre de gravité et dégage la place des turbos.' : angle === 90 ? ' L\'angle de 90° partage l\'outillage des V8 mais laisse un couple du premier ordre à compenser.' : ''}`, pro: ["Court : se loge en transversal comme en longitudinal"], con: ["Couple de basculement du premier ordre selon l'angle"] };
  return { d: `V${n} à ${fmtTick(angle)}°, un allumage tous les ${fmtTick(iv)}° ; ${crankTxt}.`, pro: [], con: [] };
}

const MOUNT_LABEL: Record<MountKey, string> = {
  FT: 'avant transversal', FL: 'avant longitudinal', FLO: 'avant longitudinal en porte-à-faux', FML: 'central avant (derrière l\'essieu avant)',
  ML: 'central arrière longitudinal', MT: 'central arrière transversal', RL: 'arrière longitudinal en porte-à-faux', RT: 'arrière transversal',
};
const DRIVE_LABEL: Record<Drive, string> = { FWD: 'traction', RWD: 'propulsion', AWD: 'transmission intégrale' };
const MOUNT_NOTE: Record<MountKey, string> = {
  FT: "Le moteur transversal libère l'habitacle et regroupe le groupe motopropulseur sur le train avant.",
  FL: "En longitudinal derrière l'essieu, la masse est reculée vers le centre du véhicule.",

  ML: "En position centrale arrière, le moteur est au plus près du centre de gravité : inertie de lacet minimale.",
  MT: "Central arrière et transversal : groupe compact, sans arbre de transmission entre moteur et roues motrices.",
  RL: "En porte-à-faux arrière, la masse sur les roues motrices favorise la motricité au prix d'un comportement plus délicat à la limite.",
  RT: "Moteur arrière couché sous le plancher de coffre : capot avant libéré, rayon de braquage très court.",
};

function dossierFor(sp: EngineSpec) {
  const tags = (sp.tech || '').split(/\s+/).filter(t => FEATURES[t]);
  const arch = architectureNotes(sp.layout, sp.n, sp.angle);
  const pros: string[] = [], cons: string[] = [];
  const add = (arr: string[], items?: string[]) => (items || []).forEach(x => { if (x && !arr.includes(x)) arr.push(x); });
  add(pros, sp.pro); add(cons, sp.con);
  add(pros, arch.pro); add(cons, arch.con);
  tags.forEach(t => { add(pros, FEATURES[t].pro); add(cons, FEATURES[t].con); });
  const Vd = sp.cc / 1e6, bmep = 4 * Math.PI * sp.nm / Vd / 1e5;
  const cm = 2 * sp.stroke / 1000 * sp.rpm / 60, sb = sp.stroke / sp.bore;
  return {
    tags, arch, pros: pros.slice(0, 7), cons: cons.slice(0, 7), bmep, cm, sb,
    sbLabel: sb < 0.97 ? 'super-carré' : sb <= 1.03 ? 'carré' : 'longue course',
    specPow: sp.ps / (sp.cc / 1000),
  };
}

function TechDossier({ sp }: { sp: EngineSpec }) {
  const d = useMemo(() => dossierFor(sp), [sp.id]);
  const chips: [string, string, string][] = [
    ['PME effective', `${fmt(d.bmep, 1)} bar`, 'Pression moyenne effective au couple maxi : 4π·C / V_d'],
    ['Puissance spécifique', `${fmt(d.specPow, 0)} ch/L`, 'Puissance constructeur rapportée à la cylindrée'],
    ['C_m au régime nominal', `${fmt(d.cm, 1)} m/s`, 'Vitesse moyenne de piston 2·S·N/60'],
    ['Course / alésage', `${fmt(d.sb, 2)} · ${d.sbLabel}`, 'Rapport S/B'],
  ];
  return (
    <section className="card p-5 flex flex-col gap-5" aria-label="Dossier technique du moteur">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div className="min-w-0">
          <div className="eyebrow">Dossier technique · {sp.brand} {sp.code}</div>
          <h2 className="disp text-[28px] font-semibold leading-tight">{sp.name}</h2>
          <p className="text-[13px] text-muted">{sp.car || sp.apps} · moteur {sp.mount ? MOUNT_LABEL[sp.mount] : '—'} · {sp.drive ? DRIVE_LABEL[sp.drive] : ''}</p>
        </div>
        <span className="ebadge mono text-[13px]" data-f={sp.fuel}>{layoutBadge(sp.layout, sp.n)}</span>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-px dchips">
        {chips.map(([l, v, h]) => <div key={l} className="p-3" title={h}><div className="text-[11.5px] text-muted">{l}</div><div className="mono text-[16px] font-medium">{v}</div></div>)}
      </div>
      <div className="grid gap-6 lg:grid-cols-[minmax(0,1.25fr)_minmax(0,1fr)]">
        <div className="flex flex-col gap-4 min-w-0">
          <div>
            <h3 className="eyebrow mb-1.5">Principe et particularités</h3>
            <p className="dtext">{sp.txt}</p>
          </div>
          <div>
            <h3 className="eyebrow mb-1.5">Architecture et équilibrage</h3>
            <p className="dtext">{d.arch.d}</p>
          </div>
          {sp.mount && <div>
            <h3 className="eyebrow mb-1.5">Implantation</h3>
            <p className="dtext">Moteur {MOUNT_LABEL[sp.mount]}, {DRIVE_LABEL[sp.drive || 'FWD']}. {MOUNT_NOTE[sp.mount]}</p>
          </div>}
          {d.tags.length > 0 && <div>
            <h3 className="eyebrow mb-2">Technologies clés</h3>
            <dl className="flex flex-col gap-2.5">
              {d.tags.map(t => <div key={t} className="dtech"><dt>{FEATURES[t].t}</dt><dd>{FEATURES[t].d}</dd></div>)}
            </dl>
          </div>}
        </div>
        <div className="grid gap-4 content-start sm:grid-cols-2 lg:grid-cols-1">
          <div className="dlist dpro">
            <h3 className="eyebrow mb-2">Points forts</h3>
            <ul>{d.pros.map(x => <li key={x}>{x}</li>)}</ul>
          </div>
          <div className="dlist dcon">
            <h3 className="eyebrow mb-2">Points faibles</h3>
            <ul>{d.cons.map(x => <li key={x}>{x}</li>)}</ul>
          </div>
        </div>
      </div>
    </section>
  );

/* interpolation monotone (Fritsch-Carlson) d'un profil [u, valeur] */
function profile(pts: number[][], x: number): number {
  const n = pts.length;
  if (x <= pts[0][0]) return pts[0][1];
  if (x >= pts[n - 1][0]) return pts[n - 1][1];
  let i = 0; while (x > pts[i + 1][0]) i++;
  const sl = (k: number) => (pts[k + 1][1] - pts[k][1]) / (pts[k + 1][0] - pts[k][0]);
  const tan = (k: number) => {
    if (k === 0) return sl(0);
    if (k === n - 1) return sl(n - 2);
    const a = sl(k - 1), b = sl(k);
    return a * b <= 0 ? 0 : 2 / (1 / a + 1 / b);
  };
  const h = pts[i + 1][0] - pts[i][0], t = (x - pts[i][0]) / h;
  const h00 = 2 * t * t * t - 3 * t * t + 1, h10 = t * t * t - 2 * t * t + t, h01 = -2 * t * t * t + 3 * t * t, h11 = t * t * t - t * t;
  return h00 * pts[i][1] + h10 * h * tan(i) + h01 * pts[i + 1][1] + h11 * h * tan(i + 1);
}
const clamp01 = (x: number) => Math.min(1, Math.max(0, x));
const smooth01 = (x: number) => { const t = clamp01(x); return t * t * (3 - 2 * t); };

/* Section transversale (demi-section, du bas au sommet) */
function sectionHalf(W: number, Wt: number, yF: number, yB: number, yT: number): number[][] {
  const hB = yB - yF, hT = Math.max(0.005, yT - yB);
  return [
    [0, yF], [0.6 * W, yF], [0.9 * W, yF + 0.02], [0.985 * W, yF + 0.12 * hB], [W, yF + 0.5 * hB], [0.99 * W, yF + 0.85 * hB],
    [0.975 * W, yB], [0.975 * W + (Wt - 0.975 * W) * 0.45, yB + 0.4 * hT], [Wt, yB + 0.85 * hT], [0.85 * Wt, yT - 0.02 * hT], [0.45 * Wt, yT - 0.002], [0, yT],
  ];
}

function buildVehicle(car: CarInfo, eng: { lo: number[]; hi: number[]; center: number[] }) {
  const U = 10; /* 1 m = 10 unités (1 unité = 100 mm, comme le moteur) */
  const P = BODIES[car.body] || BODIES.sedan;
  const L = P.L * U, Wh = P.W * U, R = P.R * U;
  const zF = (P.L / 2 - P.fo) * U, zR = zF - P.wb * U;
  const trash: any[] = [];
  const keep = (o: any) => { trash.push(o); return o; };
  const group = new THREE.Group();
  const accent = BRAND_ACCENT[car.brand] ?? 0x5d8fe0;
  const mat = {
    body: keep(new THREE.MeshStandardMaterial({ vertexColors: true, metalness: 0.15, roughness: 0.42, transparent: true, opacity: 0.92, side: THREE.FrontSide })),
    line: keep(new THREE.LineBasicMaterial({ color: 0xbfd2e2, transparent: true, opacity: 0.25 })),
    tire: keep(new THREE.MeshStandardMaterial({ color: 0x1b1f22, metalness: 0, roughness: 0.9, transparent: true })),
    rim: keep(new THREE.MeshStandardMaterial({ color: 0xb9c0c6, metalness: 0.85, roughness: 0.28, transparent: true })),
    disc: keep(new THREE.MeshStandardMaterial({ color: 0x6d747a, metalness: 0.7, roughness: 0.45, transparent: true })),
    caliper: keep(new THREE.MeshStandardMaterial({ color: accent, metalness: 0.3, roughness: 0.4, transparent: true })),
    interior: keep(new THREE.MeshStandardMaterial({ color: 0x3a4148, metalness: 0.1, roughness: 0.8, transparent: true, opacity: 0.6 })),
    drive: keep(new THREE.MeshStandardMaterial({ color: 0x9aa4ad, metalness: 0.6, roughness: 0.4, transparent: true, opacity: 0.55, depthWrite: false })),
    lampF: keep(new THREE.MeshBasicMaterial({ color: 0xeaf4ff, transparent: true })),
    lampR: keep(new THREE.MeshBasicMaterial({ color: 0xd81e28, transparent: true })),
  };

  /* --- carrosserie : surface lissée par sections --- */
  const N = 150, half = 12, ring = half * 2 - 2;
  const ys: number[][] = [];
  const pos: number[] = [], col: number[] = [];
  const paint = [0.84, 0.87, 0.9], glass = [0.16, 0.22, 0.28];
  const rings: number[][][] = [];
  const archR = R + 0.05 * U;
  for (let i = 0; i < N; i++) {
    const uu = 0.5 - 0.5 * Math.cos(Math.PI * i / (N - 1));
    const z = (uu - 0.5) * L;
    const e = Math.abs(2 * uu - 1);
    const W = Wh * (1 - 0.3 * Math.pow(e, 10));
    const yT = profile(P.top, uu) * U;
    let yB = Math.min(profile(P.belt, uu) * U, yT - 0.3);
    let yF = (P.floor + 0.10 * smooth01((uu - 0.93) / 0.07) + 0.12 * smooth01((0.07 - uu) / 0.07)) * U;
    [zF, zR].forEach(za => { const dz = z - za; if (Math.abs(dz) < archR) yF = Math.max(yF, R + Math.sqrt(archR * archR - dz * dz)); });
    yF = Math.min(yF, yB - 0.6);
    const gh = clamp01((yT - yB - 0.8) / 3);
    const Wt = W * (0.9 + (P.roofW - 0.9) * gh);
    const sh = sectionHalf(W, Wt, yF, yB, yT);
    const du = 0.002, slope = Math.abs(profile(P.top, Math.min(1, uu + du)) - profile(P.top, Math.max(0, uu - du))) / (2 * du * P.L);
    const inGlass = uu >= P.glass[0] && uu <= P.glass[1] && yT - yB > 1.5;
    const steep = inGlass && slope > 0.3;
    const eng = P.engGlass && uu >= P.engGlass[0] && uu <= P.engGlass[1];
    const pts: number[][] = [];
    const isGlass = (k: number) => (inGlass && (k === 7 || k === 8)) || (steep && k >= 7) || (!!eng && k >= 9);
    for (let k = 0; k < half; k++) pts.push([sh[k][0], sh[k][1], k]);
    for (let k = half - 2; k >= 1; k--) pts.push([-sh[k][0], sh[k][1], k]);
    pts.forEach(p => { pos.push(p[0], p[1], z); const c = isGlass(p[2]) ? glass : paint; col.push(c[0], c[1], c[2]); });
    rings.push(pts.map(p => [p[0], p[1], z]));
    ys.push([yF, yB, yT]);
  }
  const idx: number[] = [];
  for (let i = 0; i + 1 < N; i++) for (let k = 0; k < ring; k++) {
    const a = i * ring + k, b = i * ring + (k + 1) % ring, c = (i + 1) * ring + k, d = (i + 1) * ring + (k + 1) % ring;
    idx.push(a, b, c, b, d, c);
  }
  [0, N - 1].forEach((i, side) => {
    const base = pos.length / 3; let cx = 0, cy = 0;
    rings[i].forEach(p => { cx += p[0]; cy += p[1]; });
    pos.push(cx / ring, cy / ring, rings[i][0][2]); col.push(paint[0], paint[1], paint[2]);
    for (let k = 0; k < ring; k++) { const a = i * ring + k, b = i * ring + (k + 1) % ring; if (side === 0) idx.push(base, b, a); else idx.push(base, a, b); }
  });
  const bodyGeo = keep(new THREE.BufferGeometry());
  bodyGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  bodyGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  bodyGeo.setIndex(idx);
  bodyGeo.computeVertexNormals();
  const body = new THREE.Mesh(bodyGeo, mat.body); body.renderOrder = 10; group.add(body);

  /* lignes de construction : profil, ceinture, épaulement, pavillon, bas de caisse, contours avant/arrière */
  const lines = new THREE.Group(); group.add(lines);
  const pl = (pts: number[][]) => lines.add(new THREE.Line(keep(new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])))), mat.line));
  [11, 6, 4, 2].forEach(k => { pl(rings.map(r => r[k])); if (k !== 11) pl(rings.map(r => r[ring - k])); });
  const iG0 = rings.findIndex((_, i) => (0.5 - 0.5 * Math.cos(Math.PI * i / (N - 1))) >= P.glass[0]);
  const iG1 = rings.findIndex((_, i) => (0.5 - 0.5 * Math.cos(Math.PI * i / (N - 1))) > P.glass[1]);
  if (iG0 >= 0 && iG1 > iG0) { pl(rings.slice(iG0, iG1).map(r => r[8])); pl(rings.slice(iG0, iG1).map(r => r[ring - 8])); }
  [0, N - 1, iG0, iG1 - 1].forEach(i => { if (i >= 0 && rings[i]) pl([...rings[i], rings[i][0]]); });

  /* --- roues : pneu en révolution, jante à 5 branches, disque et étrier --- */
  const tw = P.tw * U, Rr = R * 0.68, xw = Wh - tw / 2 - 0.1;
  const prof = [[Rr, -tw / 2], [R * 0.93, -tw / 2], [R * 0.985, -tw * 0.42], [R, -tw * 0.28], [R, tw * 0.28], [R * 0.985, tw * 0.42], [R * 0.93, tw / 2], [Rr, tw / 2]];
  const tireGeo = keep(new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), 56)); tireGeo.rotateZ(Math.PI / 2);
  const barrelGeo = keep(new THREE.CylinderGeometry(Rr, Rr, tw * 0.92, 40, 1, true)); barrelGeo.rotateZ(Math.PI / 2);
  const hubGeo = keep(new THREE.CylinderGeometry(Rr * 0.22, Rr * 0.22, tw * 0.3, 20)); hubGeo.rotateZ(Math.PI / 2);
  const spokeGeo = keep(new THREE.BoxGeometry(tw * 0.12, Rr * 0.82, Rr * 0.16));
  const discGeo = keep(new THREE.CylinderGeometry(Rr * 0.86, Rr * 0.86, tw * 0.12, 40)); discGeo.rotateZ(Math.PI / 2);
  const calGeo = keep(new THREE.BoxGeometry(tw * 0.22, Rr * 0.5, Rr * 0.32));
  const wheels: any[] = [];
  [[1, zF], [-1, zF], [1, zR], [-1, zR]].forEach(([sx, z]) => {
    const w = new THREE.Group(); w.position.set(sx * xw, R, z); group.add(w);
    w.add(new THREE.Mesh(tireGeo, mat.tire), new THREE.Mesh(barrelGeo, mat.rim));
    const hub = new THREE.Mesh(hubGeo, mat.rim); hub.position.x = sx * tw * 0.28; w.add(hub);
    for (let k = 0; k < 5; k++) {
      const sg = new THREE.Group(); sg.rotation.x = k * 2 * Math.PI / 5; sg.position.x = sx * tw * 0.36; w.add(sg);
      const sp = new THREE.Mesh(spokeGeo, mat.rim); sp.position.y = Rr * 0.5; sg.add(sp);
    }
    const disc = new THREE.Mesh(discGeo, mat.disc); disc.position.x = sx * tw * 0.12; w.add(disc);
    const cal = new THREE.Mesh(calGeo, mat.caliper); cal.position.set(sx * tw * 0.16, Rr * 0.62, (z > 0 ? -1 : 1) * Rr * 0.35); w.add(cal);
    wheels.push(w);
  });

  /* --- feux --- */
  const yHood = profile(P.top, 0.965) * U, yTail = profile(P.top, 0.03) * U;
  [-1, 1].forEach(sx => {
    const hf = new THREE.Mesh(keep(new THREE.BoxGeometry(0.32 * U, 0.05 * U, 0.06 * U)), mat.lampF); hf.position.set(sx * Wh * 0.66, yHood - 0.12 * U, L / 2 - 0.12 * U); group.add(hf);
    const hr = new THREE.Mesh(keep(new THREE.BoxGeometry(0.34 * U, 0.05 * U, 0.05 * U)), mat.lampR); hr.position.set(sx * Wh * 0.68, Math.min(yTail, profile(P.belt, 0.03) * U) - 0.06 * U, -L / 2 + 0.06 * U); group.add(hr);
  });

  /* --- implantation du moteur --- */
  const transverse = car.mount === 'FT' || car.mount === 'MT' || car.mount === 'RT';
  const yaw = transverse ? -Math.PI / 2 : car.mount === 'RL' ? Math.PI : 0;
  const tiltX = car.mount === 'RT' ? -49 * Math.PI / 180 : 0;
  const lenZ = eng.hi[2] - eng.lo[2], off = -(eng.lo[2] + eng.hi[2]) / 2;
  const floorU = P.floor * U;
  let crankY = car.mount === 'RT' ? R + 0.2 * U : Math.max(R - 0.25 * U, floorU + 0.3 * U - eng.lo[1]);
  let zc = 0, xc = 0;
  switch (car.mount) {
    case 'FT': zc = zF + 0.16 * U; xc = -0.1 * U; break;
    case 'FLO': zc = Math.min(zF + 0.12 * U, L / 2 - 0.35 * U - lenZ / 2); break;
    case 'FL': zc = zF + 0.20 * U - lenZ / 2; break;
    case 'FML': zc = zF - 0.05 * U - lenZ / 2; break;
    case 'ML': zc = zR + 0.15 * U + lenZ / 2; break;
    case 'MT': zc = zR + 0.45 * U; xc = -0.1 * U; break;
    case 'RL': zc = zR - 0.10 * U - lenZ / 2; break;
    case 'RT': zc = zR - 0.32 * U; break;
  }
  /* coordonnées moteur → coordonnées véhicule */
  const mountXf = (p: number[]): number[] => {
    const x0 = p[0], y0 = p[1], z0 = p[2] + off;
    const x1 = x0 * Math.cos(yaw) + z0 * Math.sin(yaw), z1 = -x0 * Math.sin(yaw) + z0 * Math.cos(yaw);
    const y2 = y0 * Math.cos(tiltX) - z1 * Math.sin(tiltX), z2 = y0 * Math.sin(tiltX) + z1 * Math.cos(tiltX);
    return [x1 + xc, y2 + crankY, z2 + zc];
  };
  /* abaisse le moteur s'il dépasse du capot (carter sec, berceau bas), sans descendre sous la garde au sol */
  const corners: number[][] = [];
  for (const x of [eng.lo[0], eng.hi[0]]) for (const y of [eng.lo[1], eng.hi[1]]) for (const z of [eng.lo[2], eng.hi[2]]) corners.push([x, y, z]);
  let excess = 0;
  corners.forEach(c => { const w = mountXf(c), uu = w[2] / L + 0.5; excess = Math.max(excess, w[1] - (profile(P.top, uu) * U - 0.25)); });
  if (excess > 0) {
    const lowest = Math.min(...corners.map(c => mountXf(c)[1]));
    crankY -= Math.min(excess, Math.max(0, lowest - floorU * 0.7));
  }
  const mountG = new THREE.Group(); mountG.position.set(xc, crankY, zc); mountG.rotation.x = tiltX; group.add(mountG);
  const yawG = new THREE.Group(); yawG.rotation.y = yaw; mountG.add(yawG);

  /* --- transmission : boîte, différentiels, arbres --- */
  const gbLen = (transverse ? 0.38 : 0.6) * U;
  const gbGeo = keep(new THREE.CylinderGeometry(1.0, 1.55, gbLen, 24)); gbGeo.rotateX(Math.PI / 2);
  const gb = new THREE.Mesh(gbGeo, mat.drive); gb.position.set(0, 0, eng.lo[2] + off - gbLen / 2); yawG.add(gb);
  const shaft = (a: number[], b: number[], rd: number) => {
    const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2], d = Math.hypot(dx, dy, dz);
    if (d < 0.05) return;
    const m = new THREE.Mesh(keep(new THREE.CylinderGeometry(rd, rd, d, 12)), mat.drive);

    lines.visible = mat.line.opacity > 0.004;

  const center = [0, P.H * U * 0.45, 0];

  return { group, yawG, off, mountXf, setFade, center, radius, engCenterCar, zF, zR, L, Wh, H: P.H * U, profileAt: (z: number) => {
    const uu = z / L + 0.5; return { yT: profile(P.top, uu) * U, Wh };
  }, dispose };
}

const GAS_STOPS: [number, number[]][] = [
  [300, [0.30, 0.50, 0.86]], [700, [0.50, 0.42, 0.80]], [1100, [0.86, 0.50, 0.24]],
  [1800, [0.96, 0.60, 0.18]], [2500, [1.0, 0.82, 0.48]], [3300, [1.0, 0.96, 0.86]],
];
function gasRGB(T: number): number[] {
  if (!(T > GAS_STOPS[0][0])) return GAS_STOPS[0][1];
  for (let i = 1; i < GAS_STOPS.length; i++) {
    const [t1, c1] = GAS_STOPS[i];
    if (T <= t1) { const [t0, c0] = GAS_STOPS[i - 1]; const f = (T - t0) / (t1 - t0); return c0.map((v, j) => v + (c1[j] - v) * f); }
  }
  return GAS_STOPS[GAS_STOPS.length - 1][1];
}
const GAS_GRADIENT = `linear-gradient(90deg, ${GAS_STOPS.map(([t, c]) => `rgb(${c.map(v => Math.round(v * 255)).join(',')}) ${((t - 300) / 3000 * 100).toFixed(0)}%`).join(', ')})`;

function convexHull(p: number[][]): number[][] {
  const pts = p.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o: number[], a: number[], b: number[]) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo: number[][] = [], up: number[][] = [];
  for (const q of pts) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = pts.length - 1; i >= 0; i--) { const q = pts[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop();
  return lo.concat(up);
}

interface CylGeo { idx: number; psi: number; z: number; head: number; phase: number; }

/* Disposition des cylindres : ψ = inclinaison de l'axe (° depuis la verticale), z = position le long du vilebrequin */
function engineLayout(inp: EngineInputs): { cyls: CylGeo[]; heads: HeadGeo[] } {
  const n = inp.nCyl, B = inp.boreMm / 100;
  const ph = cylinderPhases(inp.firing);
  const cyls: CylGeo[] = [], heads: HeadGeo[] = [];
  const add = (idx: number, psi: number, z: number, head: number) => cyls.push({ idx, psi, z, head, phase: ph[idx] });
  const towardCentre = (psi: number) => (psi < 0 ? 1 : -1);
  if (inp.layout === 'I' || n === 1) {
    heads.push({ psi: 0, vr: false, inSgn: -1 });
    for (let i = 0; i < n; i++) add(i, 0, ((n - 1) / 2 - i) * 1.12 * B, 0);
  } else if (inp.layout === 'V' || inp.layout === 'B') {
    const boxer = inp.layout === 'B', a = boxer ? 180 : inp.angle, m = n / 2;
    const pitch = (boxer ? 1.25 : 1.2) * B, off = (boxer ? 0.6 : 0.3) * B;
    /* numérotation : std = banc 1 puis banc 2 (Audi, BMW, Mercedes) ; altL / altR = cylindres impairs à gauche / à droite (GM, Nissan, Subaru) */
    const nb = inp.numbering || 'std', oddBank = nb === 'altL' ? 1 : 0;
    [-a / 2, a / 2].forEach((psi, b) => {
      heads.push({ psi, vr: false, inSgn: towardCentre(psi) * (inp.hotV && !boxer ? -1 : 1) });
      const fwd = b === oddBank;
      for (let k = 0; k < m; k++) {
        const idx = nb === 'std' ? b * m + k : 2 * k + (b === oddBank ? 0 : 1);
        add(idx, psi, ((m - 1) / 2 - k) * pitch + (fwd ? off / 2 : -off / 2), b);
      }
    });
  } else if (inp.layout === 'VR') {
    heads.push({ psi: 0, vr: true, inSgn: -1 });
    for (let i = 0; i < n; i++) add(i, (i % 2 ? 1 : -1) * inp.angle / 2, ((n - 1) / 2 - i) * 0.95 * B, 0);
  } else {
    const m = n / 2, off = 0.3 * B, vr = 15;
    [-inp.angle / 2, inp.angle / 2].forEach((hp, b) => {
      heads.push({ psi: hp, vr: true, inSgn: towardCentre(hp) });
      for (let k = 0; k < m; k++) add(b * m + k, hp + (k % 2 ? 1 : -1) * vr / 2, ((m - 1) / 2 - k) * 0.95 * B + (b === 0 ? off / 2 : -off / 2), b);
    });
  }
  return { cyls, heads };
}

/* Regroupe les manetons voisins (V à manetons communs ou décalés) */
function throwGroups(cyls: CylGeo[], B: number): CylGeo[][] {
  const sorted = cyls.slice().sort((a, b) => b.z - a.z);
  const groups: CylGeo[][] = [];
  sorted.forEach(c => {
    const g = groups[groups.length - 1];
    if (g && g[g.length - 1].z - c.z < 0.45 * B) g.push(c); else groups.push([c]);
  });
  return groups;
}
