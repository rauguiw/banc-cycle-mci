name: Captures d'écran de la démo
on:
  push:
    paths: ['.github/workflows/captures.yml', '.github/scripts/shots.mjs']
permissions:
  contents: write
jobs:
  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node .github/scripts/shots.mjs
      - name: Commit des captures (et retrait de ce workflow ponctuel)
        run: |
          git config user.name "Walid RAUGUI"
          git config user.email "338677594+rauguiw@users.noreply.github.com"
          git rm -r -q .github
          git add docs/img
          git commit -m "Ajout des captures d'écran de la démo"
          git push
